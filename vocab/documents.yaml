# Vocabulary for checking a set of documents against a regulation: a case file against the law it is charged
# under, a food-safety plan against the hygiene rules, a contract against a data-protection article, a procedure
# against a standard. Nothing is extracted deterministically from such documents, so there are no element types:
# every requirement is either judged by the assessor from the documents' text (adapters.assess.documents, each
# answer citing the lines it rests on) or asked of the user. The subject is the matter the documents describe.
#
# Locator ("at"): a file and its 1-based lines as the document reader numbers them, "plan.pdf#L40-L44".
domain: documents
subject: matter

compile:
  artifact: the documents under review (a case file, a plan, a contract, a policy, records), read as text
  search_space: "the documents' own wording: defined terms, headings, names of parties, procedures or records"
  search_kinds: "words the documents would use: defined terms, headings, names of records, procedures or parties"
  # Documents are where policies, procedures, plans and records live, so a duty to have, keep, write down or plan
  # something is judged from them; only what no document in the set could show is asked of the user.
  outside: >-
    whether something the documents describe actually happened or is true in the world, the physical state of
    premises, equipment or goods, or anything no document of this kind would record. A duty to have, keep, record,
    document, plan or define something is not attested but assessed: the documents show whether it is there
  partial: none; these documents have no extracted facts
  examples: []

types:
  matter:
    description: The matter the documents describe as a whole (a case, a business, an agreement, a procedure).
    attrs: {}
