# 著作権法第13条: 法令（憲法・法律・政令・省令・告示・条例等）は著作権の目的とならない。
# The statutory text may therefore be quoted.
text_policy: public
scope: >
  Building Standards Act (建築基準法) and its Enforcement Order (建築基準法施行令)
  as in force on the as-of date below: stair width, riser and tread (令23条),
  landings (令24条), handrails (令25条), special-use stairs (令27条), the scope of
  第5章第2節 (令117条), corridor width (令119条), walking distance to a direct stair
  (令120条), two or more direct stairs (令121条), the exterior exit on the
  evacuation floor (令125条1項・3項), and the 法別表第一 use classes these rules
  read. Every element is a draft until a qualified reviewer (建築士 or 建築主事)
  approves it. This is national law, not an adopted model code, so the package has
  no `adoption` block; answers report its provisions as published.

