      - {key: floors-7, w1000: 390, w1100: 460, w1200: 510, w1300: 560, w1400: 610, w1500: 660, w1600: 710, w1700: 760, w1800: 810, row: "7"}
      - {key: floors-8, w1000: 430, w1100: 500, w1200: 555, w1300: 610, w1400: 665, w1500: 720, w1600: 775, w1700: 830, w1800: 885, row: "8"}
      - {key: floors-9, w1000: 470, w1100: 540, w1200: 600, w1300: 660, w1400: 720, w1500: 780, w1600: 840, w1700: 900, w1800: 960, row: "9"}
