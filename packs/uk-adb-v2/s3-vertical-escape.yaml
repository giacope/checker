      - {key: floors-4, w1000: 270, w1100: 340, w1200: 375, w1300: 410, w1400: 445, w1500: 480, w1600: 515, w1700: 550, w1800: 585, row: "4"}
      - {key: floors-5, w1000: 310, w1100: 380, w1200: 420, w1300: 460, w1400: 500, w1500: 540, w1600: 580, w1700: 620, w1800: 660, row: "5"}
