cite_source: >-
  Every cite.url is the gov.uk PDF above with a #page=N fragment, N being the
  1-based physical page of the PDF (the page a viewer opens), not the printed
  folio. For the main text the PDF page is the printed page number plus 12
  (printed page 14, Table 2.1, is PDF page 26; printed page 174, Table D1, is
  PDF page 186). Page numbers were checked against the text extracted from each
  PDF page and, for the tables, against renderings of those pages.
  cite.section is "ADB2 <paragraph>" or "ADB2 Table <number>".

scope: >-
  Means of escape guidance in Sections 2 to 5 and Appendix D of Approved
  Document B Volume 2: purpose groups (Table 0.1), occupant numbers from floor
  space factors (D1, Table D1), travel distance (Table 2.1, 2.6, 2.7), number
  of escape routes and exits (Table 2.2), inner rooms (2.11), widths of escape
  routes and exits (Table 2.3, 2.22), escape stair widths (3.10, Table 3.1,
  3.16, Table 3.2, Table 3.3), protected lobbies to stairs (3.34), small
  premises (2.2, 4.1, 4.2, Table 4.1), door fastenings and opening direction
  (5.9, 5.11) and headroom (5.16). v0 has one purpose group per building, so
  mixed use buildings (0.21, 0.22, 2.5, 3.2) are out of scope. Every element is
  a draft until a fire engineer or building control surveyor reviews it.

