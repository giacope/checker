# The binding requirement. Approved Documents give guidance on one way to meet
# it; following them is not mandatory (ADB2 Introduction, PDF pages 5-7).
requirement:
  instrument: The Building Regulations 2010 (SI 2010/2214)
  provision: Schedule 1, Part B (Fire safety), requirement B1 Means of warning and escape
  url: https://www.legislation.gov.uk/uksi/2010/2214/schedule/1
  read: 2026-11-14 (legislation.gov.uk, latest available revised version)
  text: >-
    B1. The building shall be designed and constructed so that there are
    appropriate provisions for the early warning of fire, and appropriate means
    of escape in case of fire from the building to a place of safety outside
    the building capable of being safely and effectively used at all material
    times.
  limits_on_application: >-
    Requirement B1 does not apply to any prison provided under section 33 of
    the Prison Act 1952 (power to provide prisons etc).

