  applies_from: 2026-09-30
  applies_from_note: >-
    The PDF lists the 2026 amendments as "set out in the September 2026 AD B
    amendments" but does not print their date. The 2026 amendment booklet
    (https://assets.publishing.service.gov.uk/media/66d57a94d107658faec7e448/AD_B_2026_amendments.pdf)
    says they take effect on 30 September 2026 for use in England; the 2019
    edition incorporating the 2020, 2022 and 2025 amendments continues to apply
    where a building notice, initial notice or full plans application was given
    or made before that day and the work is sufficiently progressed before it or
    within 18 months beginning on it. For Volume 2 the 2026 booklet changes only
    Appendix A key terms (evacuation lift lobby, evacuation shaft, interlocked
    stair, storey exit); the PDF carries the new storey exit definition
    (PDF page 148).
