# Why link-only: copying or adapting the requirement text would make this pack
# an adaptation of a CC BY-SA work, which must then be shared under the same
# licence. The pack stores only requirement identifiers, levels, links, its own
# short paraphrases in `title`, and rule logic, and leaves the text at the
# source. The validator rejects any `quote` under this policy.
text_policy: link-only
