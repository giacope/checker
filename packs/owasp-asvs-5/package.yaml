cite_source: >
  cite.url links the rendered chapter in the official repository at the release
  tag, https://github.com/OWASP/ASVS/blob/v5.0.0_release/5.0/en/<chapter file>.md,
  with the anchor GitHub renders for the section heading, for example
  #v62-password-security for "V6.2 Password Security". The chapter files render
  requirements as table rows, which have no anchors of their own, so the section
  anchor is the closest one; each anchor was checked to exist on the rendered
  page (read 2026-11-14; the anchors of v1-v3-v12-v13-v15-web.yaml, among them
  #v15-safe-deserialization, #v34-browser-security-mechanism-headers,
  #v35-browser-origin-separation,
  #v122-https-communication-with-external-facing-services,
  #v134-unintended-information-leakage,
  #v152-security-architecture-and-dependencies and #v153-defensive-coding, read
  2026-11-15, with requirement levels from the chapter files at the tag).
  `guidance` on each norm is the pack's own remediation advice, not ASVS text.
  cite.section is "ASVS 5.0 V<chapter>.<section>.<req>"; cite.ref is the form the standard asks tools to use, "v5.0.0-<req>".
scope: >
  Requirements that facts in vocab/code.yaml can decide: password storage
  (V11.4.2), database query injection (V1.2.4), session cookie attributes (V3.3.1,
  V3.3.2, V3.3.4), self-contained token verification (V9.1.1, V9.1.2), secrets in
  source code (V13.3.1), credentials in logs (V16.2.5), password length,
  composition, blocklist, and rotation (V6.2.1, V6.2.4, V6.2.5, V6.2.9, V6.2.10,
  V6.2.12), anti-automation of authentication (V6.3.1), unescaped HTML output
  (V1.2.1), OS command injection (V1.2.5), unsafe deserialization (V1.5.2), HSTS
  and CSP headers (V3.4.1, V3.4.3), request forgery (V3.5.1), HTTPS enforcement
  (V12.2.1), debug modes in production (V13.4.2), known-vulnerable dependencies
  (V15.2.1), mass assignment (V15.3.3), and request parameter filtering in logs
  (V16.2.5, system level). Every element is a draft until an application
  security reviewer approves it.
levels: >
  Each norm records its ASVS level in `level` (1, 2 or 3, from the "L" column of
  the requirement list). An application verified at level N must meet every
  requirement of level N or lower. This pack checks levels 1 and 2 by default:
  every norm here is L1 or L2 and none reads the target level, so all of them
  apply unless a caller filters norms by `level`. A target of L1 only is served
  by dropping the `level: 2` norms. v0 has no fact defaults, so a level gate
  written into the norms (for example "the target level is 1, or ...") would
  leave every failing L2 check unknown until the profile states the level. With
  a predicate default in the engine (an absent `system.asvs_level` reads as 2),
  the norms could carry the gate themselves: L2 norms "level is 1, or ...", L3
  norms "level is 3 and ...".

not_formalized:
  - "V3.3.1 second clause: the '__Secure-' prefix where '__Host-' is not used (the vocabulary has no cookie name)"
  - "V3.3.3 '__Host-' prefix unless the cookie is designed to be shared with other hosts (no cookie name or domain in the vocabulary)"
  - "V3.3.4 second clause: the session token is transferred to the client only in Set-Cookie"
  - "V6.1.1 documentation of rate limiting and anti-automation controls (read by V6.3.1)"
  - "V6.1.2, V6.2.11 context-specific word list"
  - "V9.1.3 trusted key sources (jku, x5u, jwk); V9.2.1 to V9.2.4 token content (exp, nbf, aud, type)"
  - "V11.4.1 no disallowed hash functions (MD5) for any cryptographic purpose"
  - "V11.4.2 required parameters of the approved functions (Appendix C: argon2id m/t/p, scrypt N/r/p, bcrypt cost, PBKDF2 iterations)"
  - "V13.3.1 first clause: a secrets management solution (key vault) is used; L3: hardware-backed"
  - "V16.2.5 logging other sensitive data according to its documented protection level"
  - "V1.2.1 output encoding in contexts other than HTML written without auto-escaping (attributes, URLs, CSS, JavaScript, HTTP header fields)"
  - "V1.2.5 contextual command-line encoding as an alternative to argv calls"
  - "V3.4.1 L2 clause: the HSTS policy applies to all subdomains (includeSubDomains is not in the vocabulary)"
  - "V3.4.3 minimum policy content (object-src 'none', base-uri 'none', an allowlist or nonces/hashes) and the L3 per-response policy"
  - "V3.5.1 scope condition: whether the application relies on the CORS preflight mechanism instead (V3.5.2)"
  - "V15.1.1 documented remediation time frames and the advisories' dates, read by V15.2.1 through the pack-specific Dependency.within_remediation_time_frame"
