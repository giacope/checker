# Chapter 10, Means of egress. Section numbers, table values, and row labels are
# from the 2024 IBC on ICC Digital Codes, read 2026-11-14.

tables:
  - name: T1004.5
    title: Maximum floor area allowances per occupant
    cite:
      section: "1004.5"
      table: "1004.5"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1004.5
    key: Space.function
    columns: [factor, basis]
    note: >
      The ICC page renders an empty row between "Industrial areas" and
      "Institutional areas". Austin's substitute table has "Information technology
      equipment facilities, 300 gross" there; check the printed 2024 IBC before
      adding it here.
    rows:
      - {key: accessory-storage-mechanical, factor: 300 sqft, basis: gross, row: "Accessory storage areas, mechanical equipment room"}
      - {key: agricultural-building, factor: 300 sqft, basis: gross, row: Agricultural building}
      - {key: aircraft-hangars, factor: 500 sqft, basis: gross, row: Aircraft hangars}
      - {key: airport-baggage-claim, factor: 20 sqft, basis: gross, row: Airport terminal — Baggage claim}
      - {key: airport-baggage-handling, factor: 300 sqft, basis: gross, row: Airport terminal — Baggage handling}
      - {key: airport-concourse, factor: 100 sqft, basis: gross, row: Airport terminal — Concourse}
      - {key: airport-waiting, factor: 15 sqft, basis: gross, row: Airport terminal — Waiting areas}
      - {key: assembly-gaming-floors, factor: 11 sqft, basis: gross, row: "Assembly — Gaming floors (keno, slots, etc.)"}
      - {key: assembly-exhibit-gallery-museum, factor: 30 sqft, basis: net, row: Assembly — Exhibit gallery and museum}
      - {key: assembly-fixed-seats, see: "1004.6", row: Assembly with fixed seats}
      - {key: assembly-concentrated, factor: 7 sqft, basis: net, row: "Assembly without fixed seats — Concentrated (chairs only—not fixed)"}
      - {key: assembly-standing, factor: 5 sqft, basis: net, row: Assembly without fixed seats — Standing space}
      - {key: assembly-unconcentrated, factor: 15 sqft, basis: net, row: "Assembly without fixed seats — Unconcentrated (tables and chairs)"}
      - {key: bowling-centers, factor: 7 sqft, basis: net, row: "Bowling centers, allow 5 persons for each lane including 15 feet of runway, and for additional areas"}
      - {key: business, factor: 150 sqft, basis: gross, row: Business areas}
      - {key: business-concentrated, see: "1004.8", row: Concentrated business use areas}
      - {key: courtrooms, factor: 40 sqft, basis: net, row: Courtrooms—other than fixed seating areas}
      - {key: day-care, factor: 35 sqft, basis: net, row: Day care}
      - {key: dormitories, factor: 50 sqft, basis: gross, row: Dormitories}
      - {key: educational-classroom, factor: 20 sqft, basis: net, row: Educational — Classroom area}
      - {key: educational-shops-vocational, factor: 50 sqft, basis: net, row: Educational — Shops and other vocational room areas}
      - {key: exercise-rooms, factor: 50 sqft, basis: gross, row: Exercise rooms}
      - {key: h5-fabrication-manufacturing, factor: 200 sqft, basis: gross, row: Group H-5 fabrication and manufacturing areas}
      - {key: industrial, factor: 100 sqft, basis: gross, row: Industrial areas}
      - {key: institutional-inpatient, factor: 240 sqft, basis: gross, row: Institutional areas — Inpatient treatment areas}
      - {key: institutional-outpatient, factor: 100 sqft, basis: gross, row: Institutional areas — Outpatient areas}
      - {key: institutional-sleeping, factor: 120 sqft, basis: gross, row: Institutional areas — Sleeping areas}
      - {key: kitchens-commercial, factor: 200 sqft, basis: gross, row: "Kitchens, commercial"}
      - {key: library-reading-rooms, factor: 50 sqft, basis: net, row: Library — Reading rooms}
      - {key: library-stack-area, factor: 100 sqft, basis: gross, row: Library — Stack area}
      - {key: locker-rooms, factor: 50 sqft, basis: gross, row: Locker rooms}
      - {key: mall-buildings, see: "402.8.2", row: Mall buildings—covered and open}
      - {key: mercantile, factor: 60 sqft, basis: gross, row: Mercantile}
      - {key: storage-stock-shipping, factor: 300 sqft, basis: gross, row: "Storage, stock, shipping areas"}
