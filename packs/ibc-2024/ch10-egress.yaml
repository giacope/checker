terms:
  - name: occupant_load_factor
    title: Occupant load factor
    for: {s: Space}
    cite:
      section: "1004.5"
      table: "1004.5"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1004.5
    value: {lookup: T1004.5, key: {fact: s.function}, column: factor}

  - name: occupant_load
    title: Occupant load of a space without fixed seating
    for: {s: Space}
    cite:
      section: "1004.5"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1004.5
    interpretation:
      by: pack
      note: The code divides floor area by the factor but does not say how to round; this pack rounds up.
    defers_to: ["1004.5 Exception (actual occupants, where the building official approves)"]
    value:
      ceil:
        div:
          - cases:
              - when: {eq: [{lookup: T1004.5, key: {fact: s.function}, column: basis}, net]}
                then: {fact: s.net_floor_area}
                cite: {note: net floor area}
              - else: {fact: s.gross_floor_area}
                cite: {note: gross floor area}
          - {term: occupant_load_factor, of: s}

  - name: egress_capacity_factor
    title: Egress capacity factor for components other than stairways
    cite:
      section: "1005.3.2"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1005.3.2
    defers_to: ["1005.3.2 Exception 2"]
    value:
      cases:
        - when:
            all:
              - not: {in: [{fact: building.occupancy_group}, [H-1, H-2, H-3, H-4, H-5, I-2]]}
              - {in: [{fact: building.sprinkler_system}, [nfpa13, nfpa13r]]}
              - {fact: building.emergency_voice_alarm}
          then: 0.15 in
          cite: {row: "Exception 1: sprinklered per §903.3.1.1 or §903.3.1.2 and voice/alarm per §907.5.2.2, other than Group H and I-2"}
        - else: 0.2 in
          cite: {row: 0.2 inch per occupant}

  - name: stair_capacity_factor
    title: Egress capacity factor for stairways
    cite:
      section: "1005.3.1"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1005.3.1
    defers_to: ["1005.3.1 Exception 2"]
    value:
      cases:
        - when:
            all:
              - not: {in: [{fact: building.occupancy_group}, [H-1, H-2, H-3, H-4, H-5, I-2]]}
              - {in: [{fact: building.sprinkler_system}, [nfpa13, nfpa13r]]}
              - {fact: building.emergency_voice_alarm}
          then: 0.2 in
          cite: {row: "Exception 1: sprinklered per §903.3.1.1 or §903.3.1.2 and voice/alarm per §907.5.2.2, other than Group H and I-2"}
        - else: 0.3 in
          cite: {row: 0.3 inch per occupant}

  - name: required_stair_width
    title: Required stairway width
    for: {t: Stair}
    cite:
      section: "1011.2"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1011.2
    defers_to: ["1011.2 Exception 2 (spiral stairways)", "1011.2 Exception 3 (lifts in R-3 and R-2 dwelling units)", "1009.3 (accessible means of egress stairways)"]
    note: Capacity per §1005.1, but not less than 44 in, or 36 in for stairways serving fewer than 50 occupants.
    value:
      max:
        - cases:
            - when: {lt: [{fact: t.occupant_load}, 50]}
              then: 36 in
              cite: {row: "Exception 1: serving an occupant load of less than 50"}
            - else: 44 in
              cite: {row: minimum width 44 inches}
        - mul: [{term: stair_capacity_factor}, {fact: t.occupant_load}]

  - name: max_exit_access_travel_distance
    title: Maximum exit access travel distance
    cite:
      section: "1017.2"
      table: "1017.2"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1017.2
    defers_to: ["402.8", "407.4", "408.6.1", "408.8.1", "411.2", "412.6", "1006.2.2.2", "1006.2.2.3", "1006.3.4", "1017.2.2", "1017.2.3", "1030.7", "3103.4", "3104.9"]
    note: Footnote a lists the sections in defers_to; each can change the limit for some buildings.
    value:
      cases:
        - when: {in: [{fact: building.occupancy_group}, [A-1, A-2, A-3, A-4, A-5, E, F-1, M, R-1, R-2, R-3, R-4, S-1]]}
          cite: {row: "A, E, F-1, M, R, S-1"}
          then:
            cases:
              - when: {in: [{fact: building.sprinkler_system}, [nfpa13, nfpa13r]]}
                then: 250 ft
                cite: {row: "A, E, F-1, M, R, S-1 — with sprinkler system (footnote b: §903.3.1.1 or §903.3.1.2)"}
              - else: 200 ft
                cite: {row: "A, E, F-1, M, R, S-1 — without sprinkler system (footnote e: R-3 and R-4 with §903.3.1.3)"}
        - when: {eq: [{fact: building.occupancy_group}, I-1]}
          cite: {row: I-1}
          then:
            cases:
              - when: {in: [{fact: building.sprinkler_system}, [nfpa13, nfpa13r]]}
                then: 250 ft
                cite: {row: "I-1 — with sprinkler system (footnote b)"}
              - else: not-permitted
                cite: {row: I-1 — without sprinkler system}
        - when: {eq: [{fact: building.occupancy_group}, B]}
          cite: {row: B}
          then:
            cases:
              - when: {eq: [{fact: building.sprinkler_system}, nfpa13]}
                then: 300 ft
                cite: {row: "B — with sprinkler system (footnote c: §903.3.1.1)"}
              - else: 200 ft
                cite: {row: B — without sprinkler system}
        - when: {in: [{fact: building.occupancy_group}, [F-2, S-2, U]]}
          cite: {row: "F-2, S-2, U"}
          then:
            cases:
              - when: {eq: [{fact: building.sprinkler_system}, nfpa13]}
                then: 400 ft
                cite: {row: "F-2, S-2, U — with sprinkler system (footnote c)"}
              - else: 300 ft
                cite: {row: "F-2, S-2, U — without sprinkler system"}
        - when: {in: [{fact: building.occupancy_group}, [H-1, H-2, H-3, H-4]]}
          cite: {row: H-1 to H-4, note: "footnote d (§903.2.5.1) is approximated as an NFPA 13 system"}
          then:
            cases:
              - when: {not: {eq: [{fact: building.sprinkler_system}, nfpa13]}}
                then: not-permitted
                cite: {row: H-1 to H-4 — without sprinkler system}
              - when: {eq: [{fact: building.occupancy_group}, H-1]}
                then: 75 ft
                cite: {row: H-1 — with sprinkler system (footnote d)}
              - when: {eq: [{fact: building.occupancy_group}, H-2]}
                then: 100 ft
                cite: {row: H-2 — with sprinkler system (footnote d)}
              - when: {eq: [{fact: building.occupancy_group}, H-3]}
                then: 150 ft
                cite: {row: H-3 — with sprinkler system (footnote d)}
              - else: 175 ft
                cite: {row: H-4 — with sprinkler system (footnote d)}
        - when: {in: [{fact: building.occupancy_group}, [H-5, I-2, I-3]]}
          cite: {row: "H-5, I-2, I-3"}
          then:
            cases:
              - when: {eq: [{fact: building.sprinkler_system}, nfpa13]}
                then: 200 ft
                cite: {row: "H-5, I-2, I-3 — with sprinkler system (footnote c)"}
              - else: not-permitted
                cite: {row: "H-5, I-2, I-3 — without sprinkler system"}
        - when: {eq: [{fact: building.occupancy_group}, I-4]}
          cite: {row: I-4}
          then:
            cases:
              - when: {eq: [{fact: building.sprinkler_system}, nfpa13]}
                then: 200 ft
                cite: {row: "I-4 — with sprinkler system (footnote c)"}
              - else: 150 ft
                cite: {row: I-4 — without sprinkler system}

  - name: min_corridor_width
    title: Minimum corridor width from Table 1020.3
    for: {c: Corridor}
    cite:
      section: "1020.3"
      table: "1020.3"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1020.3
    interpretation:
      by: pack
      note: >
        The table does not say which row wins when several apply. This pack takes
        the first matching row in the order below, so the widest special-use rows
        win and the 24 inch equipment-access row beats the 36 inch row for small
        occupant loads. A code professional should confirm or change the order.
    value:
      cases:
        - when:
            all:
              - {eq: [{fact: building.occupancy_group}, I-2]}
              - {fact: c.bed_movement_required}
          then: 96 in
          cite: {row: Group I-2 in areas where required for bed movement}
        - when:
            all:
              - {eq: [{fact: building.occupancy_group}, E]}
              - {ge: [{fact: c.occupant_load}, 100]}
          then: 72 in
          cite: {row: In Group E with a corridor having an occupant load of 100 or more}
        - when:
            all:
              - {term: ambulatory_care_facility}
              - {fact: c.serves_stretcher_traffic}
          then: 72 in
          cite: {row: In corridors and areas serving stretcher traffic in ambulatory care facilities}
        - when:
            all:
              - {fact: building.has_dwelling_units}
              - {fact: c.within_dwelling_unit}
          then: 36 in
          cite: {row: Within a dwelling unit}
        - when: {fact: c.mep_access_only}
          then: 24 in
          cite: {row: "Access to and utilization of mechanical, plumbing or electrical systems or equipment"}
        - when: {lt: [{fact: c.occupant_load}, 50]}
          then: 36 in
          cite: {row: With an occupant load of less than 50}
        - else: 44 in
          cite: {row: Any facility not listed in this table}

  - name: required_corridor_width
    title: Required corridor width
    for: {c: Corridor}
    cite:
      section: "1020.3"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1020.3
    note: Capacity is determined per §1005.1 but not less than Table 1020.3, so the larger of the two governs.
    value:
      max:
        - {term: min_corridor_width, of: c}
        - mul: [{term: egress_capacity_factor}, {fact: c.occupant_load}]

norms:
  - name: "1020.3"
    title: Corridors are at least as wide as Table 1020.3 and their capacity require
    modality: obligation
    for: {c: Corridor}
    cite:
      section: "1020.3"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1020.3
    require:
      ge: [{fact: c.clear_width}, {term: required_corridor_width, of: c}]

  - name: "1017.2"
    title: Exit access travel distance does not exceed Table 1017.2
    modality: obligation
    for: {s: Space}
    cite:
      section: "1017.2"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1017.2
    require:
      all:
        - ne: [{term: max_exit_access_travel_distance}, not-permitted]
        - le: [{fact: s.exit_access_travel_distance}, {term: max_exit_access_travel_distance}]

  - name: "1011.2"
    title: Stairways are at least as wide as §1011.2 and their capacity require
    modality: obligation
    for: {t: Stair}
    cite:
      section: "1011.2"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1011.2
    require:
      ge: [{fact: t.width}, {term: required_stair_width, of: t}]

  - name: "1011.5.2"
    title: Riser height 4 to 7 in, rectangular tread depth at least 11 in
    modality: obligation
    for: {t: Stair}
    cite:
      section: "1011.5.2"
      url: https://codes.iccsafe.org/s/IBC2024P1/chapter-10-means-of-egress/IBC2024P1-Ch10-Sec1011.5.2
    interpretation:
      by: pack
      note: >
        The code gives 11 inches with "(279 mm)" in parentheses, and 279 mm is
        10.98 in. This pack applies the inch values; a reading that accepts the
        printed metric equivalent would pass a 279 mm tread.
    defers_to: ["1011.5.2 Exceptions 1 to 5 (spiral, stepped aisles, R-3 and R-2 dwelling units, IEBC replacement, I-3 guard towers)", "1011.5.3 (winder treads)", "1011.5.4 (dimensional uniformity)"]
    require:
      all:
        - le: [{fact: t.riser_height}, 7 in]
        - ge: [{fact: t.riser_height}, 4 in]
        - ge: [{fact: t.tread_depth}, 11 in]
