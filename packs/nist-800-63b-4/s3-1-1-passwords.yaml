# Sec. 3.1.1 Passwords: the SHALL statements of 3.1.1.2 Password Verifiers
# that the code vocabulary can decide. Text from the HTML edition, checked
# against the PDF, read 2026-11-14.
#
# Sec. 3.1.1 limits these requirements to "centrally verified passwords that
# are used as independent authentication factors and sent over an
# authenticated protected channel to the verifier". v0 has only obligations,
# so each system-level norm reads "the system verifies no passwords, or ...".

norms:
  - name: 3.1.1.2 minimum length
    title: Passwords are at least 15 characters if used alone, at least 8 if only used with another factor
    guidance: >
      Enforce a minimum of 15 characters for passwords that can be used alone, or at
      least 8 where a second factor is always required, in the server-side
      validator.
    modality: obligation
    cite:
      section: "3.1.1.2"
      url: https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver
    quote: >-
      Verifiers and CSPs SHALL require passwords that are used as a
      single-factor authentication mechanism to be a minimum of 15 characters
      in length. Verifiers and CSPs MAY allow passwords that are only used as
      part of multi-factor authentication processes to be shorter but SHALL
      require them to be a minimum of eight characters in length.
    interpretation:
      by: pack
      note: >
        "Used as a single-factor authentication mechanism" is read as
        system.password_is_sole_factor (a password alone is enough to log in).
        A password that can be used alone on any login path is single-factor,
        even if a second factor is offered. A minimum of 15 or more satisfies
        both clauses, so it passes without knowing whether the password is the
        only factor; 8 to 14 passes only when the password is only used with
        another factor. Length is the enforced minimum at registration or
        change, in characters; counting Unicode code points as one character
        each is the adapter's job.
    status: draft
    require:
      any:
        - not: {fact: system.password_auth}
        - ge: [{fact: system.password_min_length}, 15]
        - all:
            - not: {fact: system.password_is_sole_factor}
            - ge: [{fact: system.password_min_length}, 8]

  - name: 3.1.1.2 no composition rules
    title: No composition rules other than the blocklist are imposed
    guidance: >
      Drop character-class rules (digits, upper case, symbols); rely on the minimum
      length and the blocklist check.
    modality: obligation
    cite:
      section: "3.1.1.2"
      url: https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver
    quote: >-
      Verifiers and CSPs SHALL NOT impose other composition rules (e.g.,
      requiring mixtures of different character types) for passwords.
    note: >
      Sec. 3.1.1.1 says the same of password authenticators: "Other composition
      requirements for passwords SHALL NOT be imposed." "Other" means other than
      the length and blocklist requirements of 3.1.1.2.
    status: draft
    require:
      any:
        - not: {fact: system.password_auth}
        - not: {fact: system.password_composition_rules}

  - name: 3.1.1.2 no periodic change
    title: Subscribers are not required to change passwords periodically
    guidance: >
      Remove scheduled password expiry, and force a change only on evidence that the
      password has been compromised.
    modality: obligation
    cite:
      section: "3.1.1.2"
      url: https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver
    quote: >-
      Verifiers and CSPs SHALL NOT require subscribers to change passwords
      periodically. However, verifiers SHALL force a change if there is
      evidence that the authenticator has been compromised.
    interpretation:
      by: pack
      note: >
        Only the first sentence is encoded. The forced change on evidence of
        compromise is a separate obligation the vocabulary cannot observe.
    defers_to: ["3.1.1.2 forced change on evidence of compromise"]
    status: draft
    require:
      any:
        - not: {fact: system.password_auth}
        - not: {fact: system.password_periodic_change}

  - name: 3.1.1.2 blocklist
    title: New and changed passwords are compared against a blocklist of common, expected, or compromised passwords
    guidance: >
      Compare each new or changed password, in full, against a blocklist of common,
      expected, and breached passwords, and tell the user why a password was
      rejected.
    modality: obligation
    cite:
      section: "3.1.1.2"
      url: https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver
    quote: >-
      When processing a request to establish or change a password, verifiers
      SHALL compare the prospective secret against a blocklist that contains
      known commonly used, expected, or compromised passwords.
    interpretation:
      by: pack
      note: >
        Read as the existence of the check at registration and password change
        (system.password_blocklist_check). That the entire password is compared
        rather than substrings, and that a rejected password must be replaced
        with the reason given, are not in the vocabulary.
    status: draft
    require:
      any:
        - not: {fact: system.password_auth}
        - {fact: system.password_blocklist_check}

  - name: 3.1.1.2 rate limiting
    title: Failed authentication attempts on an account are rate limited
    guidance: >
      Limit failed attempts per subscriber account, not only per IP address, for
      example with increasing delays and disabling the authenticator after at most
      100 consecutive failures.
    modality: obligation
    cite:
      section: "3.1.1.2"
      url: https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver
    quote: >-
      Verifiers SHALL implement a rate-limiting mechanism that effectively
      limits the number of failed authentication attempts that can be made on
      the subscriber account, as described in Sec. 3.2.2.
    interpretation:
      by: pack
      note: >
        The text asks for a limit "on the subscriber account". The vocabulary's
        system.login_rate_limited is true for a limit per account or per
        client; the pack accepts either, so a per-client (IP) limit alone passes
        here although it does not bound attempts on one account from many
        clients. Sec. 3.2.2's cap of no more than 100 consecutive failed
        attempts, enforced by disabling the authenticator, is not checked.
    defers_to: ["3.2.2 (no more than 100 consecutive failed attempts; disable and rebind)"]
    status: draft
    require:
      any:
        - not: {fact: system.password_auth}
        - {fact: system.login_rate_limited}

  # ------------------------------------------------------- password storage
  - name: 3.1.1.2 salted hashing
    title: Stored passwords are salted and hashed with a password hashing scheme
    guidance: >
      Store passwords with a password hashing scheme that takes a salt and a cost
      factor (argon2id, scrypt, bcrypt, PBKDF2) through a maintained library; never
      use a plain or salted fast hash.
    modality: obligation
    for: {p: PasswordStore}
    cite:
      section: "3.1.1.2"
      url: https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver
    quote: >-
      Verifiers SHALL store passwords in a form that is resistant to offline
      attacks. Passwords SHALL be salted and hashed using a suitable password
      hashing scheme. Password hashing schemes take a password, a salt, and a
      cost factor as inputs and generate a password hash.
    interpretation:
      by: pack
      note: >
        "Suitable password hashing scheme" is read with the next sentence: a
        scheme that takes a password, a salt, and a cost factor. bcrypt, scrypt,
        argon2 and pbkdf2 are; md5, sha1, sha256 and sha512 have no cost factor
        and fail even when salted; reversible encryption and plaintext fail. For
        'other', a reviewer judges the function. The value of the cost factor
        is a SHOULD ("as high as practical") and is not checked; the salt
        length is checked by the next norm.
    status: draft
    require:
      all:
        - {fact: p.salted}
        - any:
            - in: [{fact: p.algorithm}, [bcrypt, scrypt, argon2, pbkdf2]]
            - all:
                - eq: [{fact: p.algorithm}, other]
                - {fact: p.other_is_password_hashing_scheme}

  - name: 3.1.1.2 salt length
    title: The salt is at least 32 bits long
    guidance: >
      Generate a random salt of at least 32 bits (128 bits is usual) per password
      with a cryptographically secure generator, or let the hashing library generate
      it.
    modality: obligation
    for: {p: PasswordStore}
    cite:
      section: "3.1.1.2"
      url: https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver
    quote: >-
      The salt SHALL be at least 32 bits in length and chosen to minimize salt
      value collisions among stored hashes (i.e., to prevent multiple subscriber
      accounts from having the same hashed password).
    interpretation:
      by: pack
      note: >
        bcrypt's salt is fixed at 128 bits by the algorithm, so bcrypt passes
        whenever it is salted. For other functions the salt is chosen by the
        caller and its length is a pack-specific fact
        (PasswordStore.salt_length_bits) the vocabulary does not carry yet. A
        random salt of 32 bits or more is taken to meet "chosen to minimize
        collisions".
    status: draft
    require:
      all:
        - {fact: p.salted}
        - any:
            - eq: [{fact: p.algorithm}, bcrypt]
            - ge: [{fact: p.salt_length_bits}, 32]
