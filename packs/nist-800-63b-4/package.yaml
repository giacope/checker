scope: >
  The SHALL statements of Sec. 3.1.1.2 Password Verifiers that facts in
  vocab/code.yaml can decide: minimum length, no other composition rules, no
  periodic change, blocklist comparison, rate limiting of failed attempts, and
  salted hashing with a password hashing scheme. The requirements apply to
  "centrally verified passwords that are used as independent authentication
  factors" (Sec. 3.1.1), read here as system.password_auth. Every element is a
  draft until a reviewer approves it.

not_formalized:
  - "3.1.1.2 \"Verifiers and CSPs SHOULD permit a maximum password length of at least 64 characters\": a SHOULD, not a SHALL; v0 has only obligations"
  - "3.1.1.2 cost factor \"SHOULD be as high as practical\"; approved scheme from SP 800-132 SHOULD be used"
  - "3.1.1.2 Unicode code points counted as single characters; printing ASCII and space SHOULD be accepted"
  - "3.1.1.2 forced change on evidence of compromise"
  - "3.1.1.2 no hints accessible to unauthenticated claimants; no KBA prompts; password requested and verified in full"
  - "3.1.1.2 reason for rejection and guidance on choosing a strong password; password managers and autofill allowed"
  - "3.1.1.2 approved encryption and an authenticated protected channel when requesting passwords"
  - "3.1.1.2 both the salt and the hash stored for each password; optional keyed hashing with a separately stored secret key"
  - "3.2.2 consecutive failed attempts limited to no more than 100 by disabling the authenticator (no attempt count in the vocabulary)"
