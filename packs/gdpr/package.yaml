package: gdpr
version: 0.1.0
title: General Data Protection Regulation (Regulation (EU) 2016/679) — rules for checking software
publisher: Publications Office of the European Union (EUR-Lex)
jurisdiction: European Union and EEA (incorporated into the EEA Agreement by EEA Joint Committee Decision No 154/2018)
# Facts about the software system as a whole are written system.<attr>
# (vocab/code.yaml). Overlays such as uk-gdpr inherit this subject.
subject: system
scope: >
  The provisions of the GDPR that facts a code adapter can extract (vocab/code.yaml)
  bear on: the erasure path behind the right to erasure (Art. 17), the export path
  behind the right to data portability (Art. 20(1)), the legal basis for transfers
  of personal data to third countries (Art. 44, 45, 46), and three readings of
  security of processing (Art. 32(1), with Art. 5(1)(f) and 32(2)) for password
  storage, credentials written to logs, and encryption in transit. A pass means the code shows no breach
  of the encoded precondition; it is not a finding that the controller complies with
  the Regulation. Every element is a draft until a data protection lawyer reviews it.
  This is the model regulation, not an adopting law, so the package has no
  `adoption` block.

