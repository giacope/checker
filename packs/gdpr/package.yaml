  note: >
    The Cellar SPARQL endpoint lists 02016R0679-20160504 as the only consolidated
    version: the Regulation has not been amended. The Digital Omnibus proposal
    (COM(2025) 837, procedure 2025/0360(COD)) that would amend it was still under
    negotiation on 2026-11-14 (Council mandate 21.10.2026; no Parliament position).
    On 2026-11-14 EUR-Lex answered every request with a bot challenge and then
    "EUR-Lex is temporarily not fully available", so the text was read from the
    Publications Office's Cellar copy of the same consolidated version
    (http://publications.europa.eu/resource/celex/02016R0679-20160504, resolved to
    cellar 5f2552c2-cc45-11e6-ad7c-01aa75ed71a1.0022.03/DOC_1, XHTML). That file
    carries the element ids EUR-Lex uses for its HTML rendering (art_1 … art_99), so
    cite.url links are EUR-Lex consolidated-text URLs with an #art_<n> anchor. The
    anchor ids were verified in the Cellar XHTML, not on the EUR-Lex page.
    The consolidated text "is meant purely as a documentation tool and has no legal
    effect"; the authentic text is the Official Journal (oj_url).
    The Art. 20 and Art. 32(1)(a), 32(2) quotes were added on 2026-11-15 from the
    same Cellar resource (version line "02016R0679 — EN — 04.05.2016 — 000.002"),
    whose ids art_20 and art_32 were checked; every quote in the pack was then
    compared with that file's text.

