# Chapter III, Section 3: Art. 20 Right to data portability.
# Text: consolidated version 02016R0679-20160504 (see package.yaml). © European Union.
norms:
  - name: art20_data_export
    title: A system that processes personal data can give a data subject their data in a structured, machine-readable format
    guidance: >
      Offer an account data export that returns the personal data the user
      provided, including data generated by their use of the service, in a
      structured, machine-readable format such as JSON or CSV, as a download or
      through an API.
    modality: obligation
    status: draft
    cite:
      section: Art. 20(1)
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504#art_20
      quote: >
        The data subject shall have the right to receive the personal data
        concerning him or her, which he or she has provided to a controller, in a
        structured, commonly used and machine-readable format and have the right to
        transmit those data to another controller without hindrance from the
        controller to which the personal data have been provided, where: (a) the
        processing is based on consent pursuant to point (a) of Article 6(1) or
        point (a) of Article 9(2) or on a contract pursuant to point (b) of
        Article 6(1); and (b) the processing is carried out by automated means.
    interpretation:
      by: pack
      note: >
        Art. 20(1) gives the right only for personal data the data subject has
        provided, and only where the processing is based on consent (Art. 6(1)(a)
        or 9(2)(a)) or on a contract (Art. 6(1)(b)) and is carried out by
        automated means. Code cannot show the legal basis of a processing
        operation, nor which data the subject provided as against data the
        controller derived, and Art. 20(3) excludes processing for a task in the
        public interest or in the exercise of official authority. Like
        art17_erasure_path, the norm encodes the technical precondition only: a
        system that processes personal data has a code path that gives users
        their data in a structured, machine-readable format. A fail is wrong for a
        system whose processing rests only on legal obligation, vital interests,
        public task, or legitimate interests, which the controller states; a pass
        does not show that the format is "commonly used", that every provided
        datum is included, or that requests are answered in time (Art. 12(3)).
        Transmission directly to another controller (Art. 20(2)) is not checked.
    defers_to:
      - "Art. 20(1)(a) legal basis (consent or contract) and 20(1)(b) automated means"
      - "Art. 20(2) direct transmission between controllers"
      - "Art. 20(3) public-interest and official-authority processing; Art. 20(4) rights of others"
      - "Art. 12(3) time limit for acting on a request"
    require:
      any:
        - not: {fact: system.processes_personal_data}
        - {fact: system.account_data_export}
