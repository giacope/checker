  - "101.4.2"
  - "101.4.3"
  - "103+"
  - "104.3.1"
  - "105.1.1"
  - "105.2"
  - "105.5"
  - "107.2.6"
  - "110.3"
  - "112.3"
  - "113+"
  - "414.1.3"
  - "503.1.4+"
  - Chapter 9
  - Table 1004.5
  - "1010.1.2"
  - "1010.3.3"
  - "1102.1"
  - "1204+"
  - "1301.1"
  - "1507.8+"
  - "1507.9+"
  - "1607.8.2"
  - "1612+"
  - "2901.1"
  - "3102.5"
  - "3201.1"
  - "3202.1"
  - "3202.3.4"

redirects:
  - from: Chapter 9
    to: City Code Chapter 25-12, Article 7 (Fire Code), per the substitute §901.1 in §25-12-3
    quote: >
      901.1 Scope. The provisions of this chapter shall specify where fire
      protection and life safety systems are required and shall apply to the
      design, installation and operation of fire protection and life safety
      systems. For those requirements, see Chapter 25-12, Article 7 (Fire Code).

patches:
  - op: replace
    kind: table
    name: T1004.5
  # §25-12-3 substitute Table 1006.3.4(1) (single exits, R-2 dwelling units)
  - op: replace
    kind: term
    name: single_exit_r2_dwelling_units

not_formalized:
  - "1010.1.2 Egress door types (Austin substitute text, nine exceptions)"
  - "1010.3.3 Special purpose horizontal sliding, accordion or folding doors (Austin substitute text)"
  - "1006.3.4.2 Single exit four- or five-story Group R-2 occupancies (Austin addition, items 1 to 12): read as the one given fact building.meets_1006_3_4_2, not checked item by item"
  - "1025.6 Active egress path illumination system (Austin addition)"
  - "202.1 Supplemental definitions (BED AND BREAKFAST, START OF CONSTRUCTION, SUBSTANTIAL DAMAGE)"
