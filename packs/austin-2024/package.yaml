package: austin-2024
version: 0.1.0
title: City of Austin Building Code (2024 IBC with local amendments)
extends: ibc-2024
jurisdiction: City of Austin, Texas
adoption:
  instrument: City of Austin Ordinance No. 20250410-045
  codified_at: City Code Chapter 25-12, Article 1, Division 1 (§25-12-1 to §25-12-3)
  passed: 2025-04-10
  effective: 2025-07-10
  url: https://services.austintexas.gov/edims/document.cfm?id=453143
# The ordinance is a public record; its text may be quoted.
text_policy: public

# §25-12-1(B): provisions of the 2024 IBC the city deletes. "+" means "plus
# subsections". §25-12-3 substitutes some of them with the city's own text.
deleted:
