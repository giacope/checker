# Austin's Table 1006.3.4(1), from §25-12-3 of Ordinance No. 20250410-045
# (pages 16 and 17), and its new §1006.3.4.2 (pages 17 and 18). The IBC table
# allows a single exit from R-2 stories up to the third story above grade plane;
# Austin's allows it up to the fifth, and from occupiable roofs over the first to
# fourth story, and adds footnote d sending five-story buildings, and four-story
# buildings with an occupiable roof above the third story, to §1006.3.4.2.
# §25-12-1(B) does not list Table 1006.3.4(1) among the deleted provisions,
# although §25-12-3 says each of its provisions substitutes a deleted one or is
# an addition; this pack applies the printed substitute table.

predicates:
  - name: building.occupiable_roof_above_third_story
    label: the building has an occupiable roof above the third story
    type: bool
    kind: given
    refers_to: ["Austin Table 1006.3.4(1) footnote d"]

  - name: building.meets_1006_3_4_2
    label: the single-exit R-2 building meets every item of Austin §1006.3.4.2 (items 1 to 12)
    type: bool
    kind: given
    refers_to: ["Austin 1006.3.4.2"]

terms:
  - name: single_exit_r2_dwelling_units
    title: May a storey of a Group R-2 occupancy of dwelling units have one exit (Austin Table 1006.3.4(1))?
    for: {f: Storey}
    cite:
      section: "1006.3.4"
      table: "1006.3.4(1)"
      url: https://services.austintexas.gov/edims/document.cfm?id=453143
      note: City Code §25-12-3, substitute Table 1006.3.4(1) (ordinance pages 16 and 17)
    status: draft
    interpretation:
      by: pack
      note: >
        Footnote d names five-story buildings and four-story buildings with an
        occupiable roof above the third story; buildings of six or more stories are
        not named, so the footnote is not applied to their lower stories.
    defers_to: ["Austin Table 1006.3.4(1) footnote c and the occupiable-roof rows"]
    value:
      cases:
        - when: {in: [{fact: f.position}, [lower-below, first-below, first, second, third, fourth, fifth]]}
          cite:
            row: "Basement, first, second, third, fourth, or fifth story above grade plane — R-2 a, b, c, d: 4 dwelling units, 125 feet"
            quote: "Basement, first, second, third, fourth, or fifth story above grade plane and occupiable roofs over the first, second, third, or fourth story | R-2a,b,c,d | 4 dwelling units | 125 feet"
          then:
            all:
              - {in: [{fact: building.sprinkler_system}, [nfpa13, nfpa13r]]}
              - {fact: building.emergency_escape_openings}
              - le: [{fact: f.dwelling_units}, 4]
              - le: [{fact: f.max_travel_distance}, 125 ft]
              - any:
                  - lt: [{fact: building.storeys_above_ground}, 4]
                  - gt: [{fact: building.storeys_above_ground}, 5]
                  - all:
                      - eq: [{fact: building.storeys_above_ground}, 4]
                      - not: {fact: building.occupiable_roof_above_third_story}
                  - {fact: building.meets_1006_3_4_2}
        - else: false
          cite:
            row: "Sixth story above grade plane and higher — NP"
            quote: "Sixth story above grade plane and higher | NP | NA | NA"
