# Austin's substitute Table 1004.5, from §25-12-3 of Ordinance No. 20250410-045
# (pages 8 to 11). Differences from the 2024 IBC table:
#   - Standing space is 7 net, not 5 net.
#   - No "Concentrated business use areas" row (the IBC row points to §1004.8,
#     which Austin does not delete).
#   - Adds "Information technology equipment facilities", 300 gross.
#   - "Assembly with fixed seats" points to §1004.5, the table's own section;
#     the IBC row points to §1004.6. Likely a leftover cross-reference to confirm
#     with the city.

