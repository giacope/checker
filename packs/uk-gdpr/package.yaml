adoption:
  instrument: UK GDPR (EU Withdrawal Act 2018, as amended by UK law up to the Data (Use and Access) Act 2025)
  codified_at: legislation.gov.uk eur/2016/679 ("the UK GDPR", Data Protection Act 2018 s. 3(10) and s. 205(4)); assimilated law since 1.1.2024
  passed: 2018-06-26
  effective: 2020-12-31
  url: https://www.legislation.gov.uk/eur/2016/679/contents
  instruments:
    - title: European Union (Withdrawal) Act 2018 (c. 16), s. 3 (EU-derived legislation operative before IP completion day forms part of domestic law)
      url: https://www.legislation.gov.uk/ukpga/2018/16/section/3
      royal_assent: 2018-06-26
      effective: 2020-12-31 (IP completion day, 11.00 p.m., per the European Union (Withdrawal Agreement) Act 2020)
    - title: The Data Protection, Privacy and Electronic Communications (Amendments etc) (EU Exit) Regulations 2019 (S.I. 2019/419), Sch. 1
      url: https://www.legislation.gov.uk/uksi/2019/419/contents/made
      effective: 2020-12-31
      note: Makes the Regulation work as UK law ("domestic law", "the Commissioner", "third country" = outside the UK in Art. 4(27)); omitted Art. 48.
    - title: Data (Use and Access) Act 2025 (c. 18), s. 85, Sch. 7 and Sch. 9
      url: https://www.legislation.gov.uk/ukpga/2025/18/schedule/7
      royal_assent: 2025-06-19
      effective: 2026-02-05 (S.I. 2026/82, reg. 2(z9))
      note: >
        Reforms Chapter V: omits Art. 44, 45 and 46(1); inserts Art. 44A (general
        principles), 45A to 45C (transfers approved by regulations, the data
        protection test, monitoring), 46(1A) and 46(6) to (8) (safeguards plus the
        controller's reasonable and proportionate view that the data protection test
        is met), 47A and 49A. Sch. 9 Pt 2 keeps adequacy regulations under former
        s. 17A DPA 2018 in force as regulations under Art. 45A (para. 26) and lets
        arrangements entered into before 5.2.2026 keep relying on their safeguards
        (para. 27).
    - title: The Data (Use and Access) Act 2025 (Consequential Amendments and Transitional Provision) Regulations 2026 (S.I. 2026/386), Sch. 3 para. 41
      effective: 2026-09-30 (S.I. 2026/1015, reg. 2(c))
      note: Substitutes words in Art. 46(2)-(3), 47, 47A, 49 and 50 (the version of Chapter V valid from 2026-09-30).

source:
  as_of: 2026-11-14
  retrieved: 2026-11-14
  api: https://www.legislation.gov.uk/eur/2016/679/<part>/data.xml (CLML)
  versions:
    - part: Chapter V
      valid_from: 2026-09-30
      modified: 2026-10-05
      url: https://www.legislation.gov.uk/eur/2016/679/chapter/V
    - part: Art. 17
      valid_from: 2026-03-31
      url: https://www.legislation.gov.uk/eur/2016/679/article/17
    - part: Art. 32
      valid_from: 2025-08-20
      url: https://www.legislation.gov.uk/eur/2016/679/article/32
    - part: Art. 20
      valid_from: 2016-04-27 (start date in the CLML; no amendment applied)
      url: https://www.legislation.gov.uk/eur/2016/679/article/20
  note: >
    cite.url links are point-in-time URLs for 2026-11-14
    (…/article/<n>/2026-11-14); each was fetched and returned 200. legislation.gov.uk
    gives every article its own URL, so no fragment anchor is needed. The
    legislation.gov.uk XML listed no prospective changes to Chapter V on the
    retrieval date. On 2026-11-15 the point-in-time CLML of Art. 20 and Art. 32
    (…/article/20/2026-11-14/data.xml, …/article/32/2026-11-14/data.xml) was
    compared with the gdpr pack's quotes: Art. 20(1) and Art. 32(1) and (2) read
    word for word the same (only list letters print without parentheses), and
    neither article has unapplied effects, so the inherited art20_data_export and
    Art. 32 norms need no patch. Art. 32(3) and (4) differ in wording but are not
    quoted or encoded.

# Provisions of the Regulation as published by the EU that UK law omits, as listed
# in the legislation.gov.uk amendment notes.
deleted:
  - Art. 44
  - Art. 45
  - Art. 46(1)
  - Art. 48

redirects:
  - from: Art. 44
    to: Art. 44A (General principles for transfers), inserted by the Data (Use and Access) Act 2025, Sch. 7 para. 2(2)
  - from: Art. 45
    to: Art. 45A to 45C (Transfers approved by regulations; the data protection test), and Data Protection Act 2018 Sch. 21 paras 4 and 5
  - from: Art. 46(1)
    to: Art. 46(1A), inserted by the Data (Use and Access) Act 2025, Sch. 7 para. 6(3)

patches:
  - op: replace
    kind: norm
    name: chapter5_transfer_basis
  - op: replace
    kind: predicate
    name: Transfer.third_country
  - op: replace
    kind: predicate
    name: Transfer.adequacy_or_safeguards

not_formalized:
  - "Art. 17(1)(e) and 17(3)(b), (d) as amended, and 17(1)(g), (4), (5) (erasure of data from malicious allegations, from 31.3.2026): they change when the duty to erase arises, not the erasure path the inherited norm art17_erasure_path requires"
  - "Art. 32(3) and 32(4) as amended: no change to Art. 32(1) or (2), so the inherited Art. 32 norms apply unchanged"
  - "Art. 44A(3) and Art. 49A restrictions by regulations in the public interest"
  - "Art. 46(1A)(b) safeguards in an instrument between public bodies"
  - "Art. 47 binding corporate rules; Art. 47A further safeguards by regulations"
  - "Art. 49 derogations (as amended)"
  - "Data Protection Act 2018 Sch. 21 para. 9 (binding corporate rules authorised before IP completion day)"
