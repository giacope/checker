[project]
name = "normir"
version = "0.1.0"
description = "Norm IR v0: formalized building-code rule packs and a reference evaluator"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.4.5",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "ifcopenshell>=0.9.0.post1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.3.0",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6",
    "rapidocr-onnxruntime>=1.4.4",
    "tree-sitter==0.25.2",
    "tree-sitter-elixir>=0.3.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-typescript==0.23.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
normir = "normir.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/normir", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
