norms:
- name: k4-1
  title: Make the work's Creative Commons Attribution ShareAlike 3.0 license terms clear to recipients whenever it is reused
    or distributed.
  modality: obligation
  status: draft
  cite:
    section: Disclose license terms on reuse or distribution
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L5-L7
    url: /regulations/rfe5181cd6e#c4
    quote: 'This document is released under the Creative Commons Attribution ShareAlike 3.0 license. For any reuse or

      distribution, you must make clear to others the license terms of this work.

      http://creativecommons.org/licenses/by-sa/3.0/'
  interpretation:
    by: model
    note: Disclosure during reuse or distribution is a process obligation that source code and configuration cannot establish.
  require:
    fact: system.req_rfe5181cd6e_k4_1
- name: k9-1
  title: Assess secure software development lifecycle maturity and development staff knowledge when starting to use the guide.
  modality: obligation
  status: draft
  cite:
    section: Assess development maturity and provide security validation capabilities
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L39-L46
    url: /regulations/rfe5181cd6e#c9
    quote: 'When utilizing this guide, development teams should start by assessing the maturity of their secure software

      development lifecycle and the knowledge level of their development staff. Since this guide does not cover

      the details of how to implement each coding practice, developers will either need to have the prior

      knowledge or have sufficient resources available that provide the necessary guidance. This guide provides

      coding practices that can be translated into coding requirements without the need for the developer to have an

      in depth understanding of security vulnerabilities and exploits. However, other members of the development

      team should have the responsibility, adequate training, tools and resources to validate that the design and

      implementation of the entire system is secure.'
  interpretation:
    by: model
    note: These assessments concern organisational practices and staff knowledge.
  require:
    fact: system.req_rfe5181cd6e_k9_1
- name: k9-2
  title: Ensure developers have the knowledge or guidance resources needed to implement the coding practices.
  modality: obligation
  status: draft
  cite:
    section: Assess development maturity and provide security validation capabilities
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L39-L46
    url: /regulations/rfe5181cd6e#c9
    quote: 'When utilizing this guide, development teams should start by assessing the maturity of their secure software

      development lifecycle and the knowledge level of their development staff. Since this guide does not cover

      the details of how to implement each coding practice, developers will either need to have the prior

      knowledge or have sufficient resources available that provide the necessary guidance. This guide provides

      coding practices that can be translated into coding requirements without the need for the developer to have an

      in depth understanding of security vulnerabilities and exploits. However, other members of the development

      team should have the responsibility, adequate training, tools and resources to validate that the design and

      implementation of the entire system is secure.'
  interpretation:
    by: model
    note: Developer knowledge and access to adequate guidance cannot be established from application source code.
  require:
    fact: system.req_rfe5181cd6e_k9_2
- name: k9-3
  title: Assign other development team members responsibility for validating the security of the entire system's design and
    implementation.
  modality: obligation
  status: draft
  cite:
    section: Assess development maturity and provide security validation capabilities
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L39-L46
    url: /regulations/rfe5181cd6e#c9
    quote: 'When utilizing this guide, development teams should start by assessing the maturity of their secure software

      development lifecycle and the knowledge level of their development staff. Since this guide does not cover

      the details of how to implement each coding practice, developers will either need to have the prior

      knowledge or have sufficient resources available that provide the necessary guidance. This guide provides

      coding practices that can be translated into coding requirements without the need for the developer to have an

      in depth understanding of security vulnerabilities and exploits. However, other members of the development

      team should have the responsibility, adequate training, tools and resources to validate that the design and

      implementation of the entire system is secure.'
  interpretation:
    by: model
    note: Assignment of validation responsibilities is an organisational obligation.
  require:
    fact: system.req_rfe5181cd6e_k9_3
- name: k9-4
  title: Provide security validators with adequate training, tools, and resources.
  modality: obligation
  status: draft
  cite:
    section: Assess development maturity and provide security validation capabilities
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L39-L46
    url: /regulations/rfe5181cd6e#c9
    quote: 'When utilizing this guide, development teams should start by assessing the maturity of their secure software

      development lifecycle and the knowledge level of their development staff. Since this guide does not cover

      the details of how to implement each coding practice, developers will either need to have the prior

      knowledge or have sufficient resources available that provide the necessary guidance. This guide provides

      coding practices that can be translated into coding requirements without the need for the developer to have an

      in depth understanding of security vulnerabilities and exploits. However, other members of the development

      team should have the responsibility, adequate training, tools and resources to validate that the design and

      implementation of the entire system is secure.'
  interpretation:
    by: model
    note: The adequacy of personnel training and available validation resources requires organisational evidence.
  require:
    fact: system.req_rfe5181cd6e_k9_4
- name: k12-1
  title: Clearly define roles and responsibilities.
  modality: obligation
  status: draft
  cite:
    section: Define roles and responsibilities
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L51-L51
    url: /regulations/rfe5181cd6e#c12
    quote: • Clearly define roles and responsibilities
  interpretation:
    by: model
    note: Team roles and responsibilities are organisational assignments.
  require:
    fact: system.req_rfe5181cd6e_k12_1
- name: k13-1
  title: Provide development teams with adequate software security training.
  modality: obligation
  status: draft
  cite:
    section: Provide software security training
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L52-L52
    url: /regulations/rfe5181cd6e#c13
    quote: • Provide development teams with adequate software security training
  interpretation:
    by: model
    note: Training provision and adequacy cannot be established from application source code.
  require:
    fact: system.req_rfe5181cd6e_k13_1
- name: k14-1
  title: Implement a secure software development lifecycle.
  modality: obligation
  status: draft
  cite:
    section: Implement a secure software development lifecycle
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L53-L54
    url: /regulations/rfe5181cd6e#c14
    quote: '• Implement a secure software development lifecycle

      o OWASP CLASP Project'
  interpretation:
    by: model
    note: A development lifecycle is an organisational process.
  require:
    fact: system.req_rfe5181cd6e_k14_1
- name: k15-1
  title: Establish secure coding standards.
  modality: obligation
  status: draft
  cite:
    section: Establish secure coding standards
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L55-L56
    url: /regulations/rfe5181cd6e#c15
    quote: '• Establish secure coding standards

      o OWASP Development Guide Project'
  interpretation:
    by: model
    note: Establishing standards is a policy obligation.
  require:
    fact: system.req_rfe5181cd6e_k15_1
- name: k16-1
  title: Provide a reusable object library.
  modality: obligation
  status: draft
  cite:
    section: Build a reusable object library
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L57-L58
    url: /regulations/rfe5181cd6e#c16
    quote: '• Build a re-usable object library

      o OWASP Enterprise Security API (ESAPI) Project'
  interpretation:
    by: model
    note: A reviewer can inspect the source for a reusable library, but no supplied fact represents it.
  require:
    fact: system.req_rfe5181cd6e_k16_1
- name: k17-1
  title: Verify the effectiveness of security controls.
  modality: obligation
  status: draft
  cite:
    section: Verify security control effectiveness
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L59-L60
    url: /regulations/rfe5181cd6e#c17
    quote: '• Verify the effectiveness of security controls

      o OWASP Application Security Verification Standard (ASVS) Project)'
  interpretation:
    by: model
    note: Performing effectiveness verification requires evidence of validation activities and results.
  require:
    fact: system.req_rfe5181cd6e_k17_1
- name: k18-1
  title: Establish secure outsourced development practices.
  modality: obligation
  status: draft
  cite:
    section: Establish secure outsourced development practices
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L61-L63
    url: /regulations/rfe5181cd6e#c18
    quote: '• Establish secure outsourced development practices including defining security requirements and

      verification methodologies in both the request for proposal (RFP) and contract.

      o OWASP Legal Project'
  interpretation:
    by: model
    note: Outsourced development practices are organisational processes.
  require:
    fact: system.req_rfe5181cd6e_k18_1
- name: k18-2
  title: Define security requirements and verification methodologies in both outsourced development RFPs and contracts.
  modality: obligation
  status: draft
  cite:
    section: Establish secure outsourced development practices
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L61-L63
    url: /regulations/rfe5181cd6e#c18
    quote: '• Establish secure outsourced development practices including defining security requirements and

      verification methodologies in both the request for proposal (RFP) and contract.

      o OWASP Legal Project'
  interpretation:
    by: model
    note: RFP and contract contents require procurement and contractual evidence.
  require:
    fact: system.req_rfe5181cd6e_k18_2
- name: k29-1
  title: Perform all required data validation on a trusted system.
  modality: obligation
  status: draft
  cite:
    section: Validate data on trusted systems
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L110-L110
    url: /regulations/rfe5181cd6e#c29
    quote: • Conduct all data validation on a trusted system (e.g., The server)
  interpretation:
    by: model
    note: A reviewer can trace validation execution and trust boundaries, but the supplied facts do not describe them.
  require:
    fact: system.req_rfe5181cd6e_k29_1
- name: k30-1
  title: Identify all data sources and classify each as trusted or untrusted.
  modality: obligation
  status: draft
  cite:
    section: Classify data sources and validate untrusted data
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L111-L112
    url: /regulations/rfe5181cd6e#c30
    quote: '• Identify all data sources and classify them into trusted and untrusted. Validate all data from untrusted

      sources (e.g., Databases, file streams, etc.)'
  interpretation:
    by: model
    note: A reviewer can inspect data ingress and its trust classification in source and configuration; no supplied fact captures
      this.
  require:
    fact: system.req_rfe5181cd6e_k30_1
- name: k30-2
  title: Validate all data received from untrusted sources, including databases and file streams.
  modality: obligation
  status: draft
  cite:
    section: Classify data sources and validate untrusted data
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L111-L112
    url: /regulations/rfe5181cd6e#c30
    quote: '• Identify all data sources and classify them into trusted and untrusted. Validate all data from untrusted

      sources (e.g., Databases, file streams, etc.)'
  interpretation:
    by: model
    note: The supplied facts do not capture general validation of data from every untrusted source.
  require:
    fact: system.req_rfe5181cd6e_k30_2
- name: k31-1
  title: Provide a centralized input validation routine for the application.
  modality: obligation
  status: draft
  cite:
    section: Centralize input validation
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L113-L113
    url: /regulations/rfe5181cd6e#c31
    quote: • There should be a centralized input validation routine for the application
  interpretation:
    by: model
    note: Validation centralization is visible in application structure but is not represented by the supplied facts.
  require:
    fact: system.req_rfe5181cd6e_k31_1
- name: k32-1
  title: Specify an appropriate character set, such as UTF-8, for every input source.
  modality: obligation
  status: draft
  cite:
    section: Specify input character sets
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L114-L114
    url: /regulations/rfe5181cd6e#c32
    quote: • Specify proper character sets, such as UTF-8, for all sources of input
  interpretation:
    by: model
    note: The facts do not describe input character set declarations.
  require:
    fact: system.req_rfe5181cd6e_k32_1
- name: k33-1
  title: Convert input to a common character set before validating it.
  modality: obligation
  status: draft
  cite:
    section: Canonicalize data before validation
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L115-L115
    url: /regulations/rfe5181cd6e#c33
    quote: • Encode data to a common character set before validating (Canonicalize)
  interpretation:
    by: model
    note: The facts do not capture character set conversion or validation order.
  require:
    fact: system.req_rfe5181cd6e_k33_1
- name: k34-1
  title: Reject input whenever validation fails.
  modality: obligation
  status: draft
  cite:
    section: Reject input when validation fails
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L116-L116
    url: /regulations/rfe5181cd6e#c34
    quote: • All validation failures should result in input rejection
  interpretation:
    by: model
    note: The facts do not capture validation failure handling.
  require:
    fact: system.req_rfe5181cd6e_k34_1
- name: k35-1
  title: Determine whether UTF-8 extended characters are supported and, if supported, validate input only after UTF-8 decoding
    completes.
  modality: obligation
  status: draft
  cite:
    section: Validate after UTF-8 decoding
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L117-L118
    url: /regulations/rfe5181cd6e#c35
    quote: '• Determine if the system supports UTF-8 extended character sets and if so, validate after UTF-8

      decoding is completed'
  interpretation:
    by: model
    note: Source code and configuration can show UTF-8 support and decoding order, but the facts do not capture them.
  require:
    fact: system.req_rfe5181cd6e_k35_1
- name: k36-1
  title: Validate all client-provided data before processing, including parameters, URLs, headers, cookies, and automated
    submissions from embedded code.
  modality: obligation
  status: draft
  cite:
    section: Validate all client data before processing
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L119-L121
    url: /regulations/rfe5181cd6e#c36
    quote: '• Validate all client provided data before processing, including all parameters, URLs and HTTP header

      content (e.g. Cookie names and values). Be sure to include automated post backs from JavaScript,

      Flash or other embedded code'
  interpretation:
    by: model
    note: The facts do not describe validation coverage or its order relative to processing.
  require:
    fact: system.req_rfe5181cd6e_k36_1
- name: k37-1
  title: Verify that request and response header values contain only ASCII characters.
  modality: obligation
  status: draft
  cite:
    section: Restrict request and response headers to ASCII
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L122-L122
    url: /regulations/rfe5181cd6e#c37
    quote: • Verify that header values in both requests and responses contain only ASCII characters
  interpretation:
    by: model
    note: The facts do not capture header character validation.
  require:
    fact: system.req_rfe5181cd6e_k37_1
- name: k38-1
  title: Validate data at redirect targets even when requests bypass validation performed before the redirect.
  modality: obligation
  status: draft
  cite:
    section: Validate data from redirects
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L123-L124
    url: /regulations/rfe5181cd6e#c38
    quote: '• Validate data from redirects (An attacker may submit malicious content directly to the target of the

      redirect, thus circumventing application logic and any validation performed before the redirect)'
  interpretation:
    by: model
    note: The facts do not capture redirect target validation.
  require:
    fact: system.req_rfe5181cd6e_k38_1
- name: k39-1
  title: Validate input against its expected data type.
  modality: obligation
  status: draft
  cite:
    section: Validate expected data types
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L125-L125
    url: /regulations/rfe5181cd6e#c39
    quote: • Validate for expected data types
  interpretation:
    by: model
    note: The facts do not capture input type validation.
  require:
    fact: system.req_rfe5181cd6e_k39_1
- name: k40-1
  title: Validate input values against their permitted ranges.
  modality: obligation
  status: draft
  cite:
    section: Validate data ranges
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L126-L126
    url: /regulations/rfe5181cd6e#c40
    quote: • Validate data range
  interpretation:
    by: model
    note: The facts do not capture general input range constraints.
  require:
    fact: system.req_rfe5181cd6e_k40_1
- name: k41-1
  title: Validate input lengths against their permitted limits.
  modality: obligation
  status: draft
  cite:
    section: Validate data lengths
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L127-L127
    url: /regulations/rfe5181cd6e#c41
    quote: • Validate data length
  interpretation:
    by: model
    note: The facts do not capture general input length constraints; password limits alone do not establish this requirement.
  require:
    fact: system.req_rfe5181cd6e_k41_1
- name: k42-1
  title: Validate input against an allowlist of permitted characters wherever possible.
  modality: obligation
  status: draft
  cite:
    section: Validate input against allowed characters
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L128-L128
    url: /regulations/rfe5181cd6e#c42
    quote: • Validate all input against a "white" list of allowed characters, whenever possible
  interpretation:
    by: model
    note: The facts do not capture character allowlists or where they are feasible.
  require:
    fact: system.req_rfe5181cd6e_k42_1
- name: k43-1
  title: Where potentially hazardous input characters are allowed, apply suitable additional controls throughout their use,
    such as output encoding and secure task-specific APIs.
  modality: obligation
  status: draft
  cite:
    section: Apply additional controls when allowing hazardous characters
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L129-L132
    url: /regulations/rfe5181cd6e#c43
    quote: '• If any potentially hazardous characters must be allowed as input, be sure that you implement

      additional controls like output encoding, secure task specific APIs and accounting for the utilization

      of that data throughout the application . Examples of common hazardous characters include:

      < > " '' % ( ) & + \ \'' \"'
  interpretation:
    by: model
    note: The facts do not identify where hazardous characters are allowed or whether controls cover their uses; query construction
      and HTML sanitization facts alone do not establish which controls are required.
  require:
    fact: system.req_rfe5181cd6e_k43_1
- name: k44-1
  title: Validate inputs for null bytes, newlines, and path traversal sequences, using separate checks where standard validation
    is insufficient and canonicalization to address alternate encodings and obfuscation.
  modality: obligation
  status: draft
  cite:
    section: Check null bytes, newlines, and path alteration characters
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L133-L139
    url: /regulations/rfe5181cd6e#c44
    quote: '• If your standard validation routine cannot address the following inputs, then they should be checked

      discretely

      o Check for null bytes (%00)

      o Check for new line characters (%0d, %0a, \r, \n)

      o Check for “dot-dot-slash" (../ or ..\) path alterations characters. In cases where UTF-8 extended

      character set encoding is supported, address alternate representation like: %c0%ae%c0%ae/

      (Utilize canonicalization to address double encoding or other forms of obfuscation attacks)'
  interpretation:
    by: model
    note: The facts do not describe input validation or canonicalization.
  require:
    fact: system.req_rfe5181cd6e_k44_1
- name: k46-1
  title: Perform all encoding on a trusted system such as the server.
  modality: obligation
  status: draft
  cite:
    section: Encode output on trusted systems
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L141-L141
    url: /regulations/rfe5181cd6e#c46
    quote: • Conduct all encoding on a trusted system (e.g., The server)
  interpretation:
    by: model
    note: The facts do not identify where encoding executes or whether that system is trusted.
  require:
    fact: system.req_rfe5181cd6e_k46_1
- name: k47-1
  title: Use a standard, tested routine for each type of outbound encoding.
  modality: obligation
  status: draft
  cite:
    section: Use standard tested encoding routines
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L142-L142
    url: /regulations/rfe5181cd6e#c47
    quote: • Utilize a standard, tested routine for each type of outbound encoding
  interpretation:
    by: model
    note: Encoding routines and their suitability are not represented by the facts.
  require:
    fact: system.req_rfe5181cd6e_k47_1
- name: k48-1
  title: Encode all data originating outside the application's trust boundary for its specific output context before returning
    it to clients.
  modality: obligation
  status: draft
  cite:
    section: Contextually encode untrusted data returned to clients
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L143-L144
    url: /regulations/rfe5181cd6e#c48
    quote: '• Contextually output encode all data returned to the client that originated outside the application''s trust

      boundary. HTML entity encoding is one example, but does not work in all cases'
  interpretation:
    by: model
    note: The facts do not capture context-specific output encoding; HTML sanitization alone does not establish this requirement.
  require:
    fact: system.req_rfe5181cd6e_k48_1
- name: k49-1
  title: Encode every output character unless it is known to be safe for the intended interpreter.
  modality: obligation
  status: draft
  cite:
    section: Encode characters unless safe for the interpreter
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L145-L145
    url: /regulations/rfe5181cd6e#c49
    quote: • Encode all characters unless they are known to be safe for the intended interpreter
  interpretation:
    by: model
    note: The facts do not describe encoding character sets or the intended interpreter.
  require:
    fact: system.req_rfe5181cd6e_k49_1
- name: k50-1
  title: Apply context-appropriate sanitization or safe query binding to untrusted data used in SQL, XML, and LDAP queries.
  modality: obligation
  status: draft
  cite:
    section: Sanitize untrusted output to SQL, XML, and LDAP queries
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L146-L146
    url: /regulations/rfe5181cd6e#c50
    quote: • Contextually sanitize all output of un-trusted data to queries for SQL, XML, and LDAP
  interpretation:
    by: model
    note: Query construction facts do not establish context-appropriate sanitization, and they do not cover XML and LDAP query
      handling.
  require:
    fact: system.req_rfe5181cd6e_k50_1
- name: k51-1
  title: Sanitize untrusted data for its operating system command context before passing it to commands.
  modality: obligation
  status: draft
  cite:
    section: Sanitize untrusted output to operating system commands
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L147-L147
    url: /regulations/rfe5181cd6e#c51
    quote: • Sanitize all output of un-trusted data to operating system commands
  interpretation:
    by: model
    note: Command construction and input provenance do not show whether command arguments or shell values are appropriately
      sanitized.
  require:
    fact: system.req_rfe5181cd6e_k51_1
- name: k53-1
  title: Require authentication for every page and resource unless it is explicitly intended to be public.
  modality: obligation
  status: draft
  cite:
    section: Require authentication for nonpublic pages and resources
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L149-L149
    url: /regulations/rfe5181cd6e#c53
    quote: • Require authentication for all pages and resources, except those specifically intended to be public
  interpretation:
    by: model
    note: The facts do not describe authentication coverage or which resources are explicitly public.
  require:
    fact: system.req_rfe5181cd6e_k53_1
- name: k54-1
  title: Enforce all authentication controls on a trusted system such as the server.
  modality: obligation
  status: draft
  cite:
    section: Enforce authentication on trusted systems
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L150-L150
    url: /regulations/rfe5181cd6e#c54
    quote: • All authentication controls must be enforced on a trusted system (e.g., The server)
  interpretation:
    by: model
    note: The facts do not show the execution location or trust boundary of all authentication controls.
  require:
    fact: system.req_rfe5181cd6e_k54_1
- name: k55-1
  title: Use standard, tested authentication services wherever possible.
  modality: obligation
  status: draft
  cite:
    section: Use standard tested authentication services
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L151-L151
    url: /regulations/rfe5181cd6e#c55
    quote: • Establish and utilize standard, tested, authentication services whenever possible
  interpretation:
    by: model
    note: A reviewer can examine authentication implementations, dependencies, and available integration options, which the
      facts do not capture.
  require:
    fact: system.req_rfe5181cd6e_k55_1
- name: k56-1
  title: Centralize all authentication controls, including libraries that call external authentication services.
  modality: obligation
