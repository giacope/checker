- name: k255-1
  title: Implement a safe application update mechanism.
  modality: obligation
  status: draft
  cite:
    section: Secure updates with verified signatures and encrypted transfers
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L471-L473
    url: /regulations/rfe5181cd6e#c255
    quote: '• Implement safe updating. If the application will utilize automatic updates, then use cryptographic

      signatures for your code and ensure your download clients verify those signatures. Use encrypted

      channels to transfer the code from the host server'
  interpretation:
    by: model
    note: The facts do not describe update mechanisms or their security controls.
  require:
    fact: system.req_rfe5181cd6e_k255_1
