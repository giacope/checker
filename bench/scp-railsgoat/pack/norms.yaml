- name: k251-1
  title: Prevent calculation errors caused by numeric size, precision, signedness, truncation, conversions, NaN, overflow,
    or underflow.
  modality: obligation
  status: draft
  cite:
    section: Prevent calculation errors arising from numeric representations
    at: OWASP_SCP_Quick_Reference_Guide_v2.pdf#L462-L466
    url: /regulations/rfe5181cd6e#c251
    quote: '• Avoid calculation errors by understanding your programming language''s underlying representation

      and how it interacts with numeric calculation. Pay close attention to byte size discrepancies, precision,

      signed/unsigned distinctions, truncation, conversion and casting between types, "not-a-number"

      calculations, and how your language handles numbers that are too large or too small for its underlying

      representation'
