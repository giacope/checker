    Door: 254
    Stair: 3
    Ramp: 0
    Corridor: 40
  travel_distance:
    method: 'geodesic to the nearest exit inside the walkable floor: grid Dijkstra (16 directions) and string-pulling'
    resolution:
      First Floor: 0.1 m
      Second Floor: 0.1 m
    cells:
      First Floor: 236501
      Second Floor: 155026
    exit_doors:
      First Floor:
      - door 1AC3
      - door 1AC5a
      - door 1CA1
      - door 1CA1
      - door 1CC3
      - door 1E15
      - door 1E15A
      - door 1E17
      - door 1E20
      - door 1E21
      - door 1E24
      - door 1EC1A
      - door 1EC4
      Second Floor:
      - door 2BS2 into space 2BS2 STAIR
      - door 2CS3 into space 2CS3 STAIR
    assumptions:
    - 'walkable floor: the bottom faces of the storey''s IfcSpace solids, plus door passages, plus stair footprints, minus
      IfcColumn footprints; walls bound the spaces and are not read; furniture and fixtures are ignored'
    - spaces named as voids, shafts, lifts or roofs (open to below, shaft, Schacht, elevator, Aufzug, roof) and spaces with
      Pset_SpaceCommon.IsExternal true (balconies, terraces) are not walkable
    - a door is passable over its opening's plan footprint (the IfcOpeningElement it fills, else the door body), extended
      0.3 m into the rooms on both sides; spaces closer than 0.04 m are joined (room separation lines)
    - 'exits on the storey at grade: doors with Pset_DoorCommon.IsExternal true (where it is not set: a door with a room on
      one side only); travel is measured to the door''s opening'
    - 'exits on other storeys: stair enclosures, i.e. IfcStair footprints serving the storey, spaces named as stairs, and
      spaces with Pset_SpaceFireSafetyRequirements.FireExit true; travel is measured to the door into the enclosure, or to
      the enclosure itself where no door separates it'
    - 'path: geodesic inside the walkable floor; Dijkstra on a 0.1 m grid with 16 move directions (coarser only above 450000
      cells a storey) to the two nearest exits, then the paths from the 4 farthest cells of each space are string-pulled against
      the floor polygon, their bends moved onto the floor''s corners and their ends onto the exit; the longest of these is
      reported, measured from the space''s corner where the farthest cell lies in one'
    - the space's farthest point is searched among grid cells, so a farther point between cells can be missed by up to a cell;
      where two exits are within 3 % of each other both are tried
    - the grade storey is the lowest with Pset_BuildingStoreyCommon.AboveGround true, else the one nearest elevation 0; a
      level counts as a storey when it has a walkable space and a door
    - 'travel distance is horizontal: on the grade storey it ends at an exterior door, elsewhere at the stair enclosure, so
      travel down the stair is not included'
  timings_s:
    open: 0.64
    geometry: 2.99
    properties: 0.6
    plans: 0.61
    travel First Floor: 2.9
    travel Second Floor: 1.43
    travel: 4.36
