# Ground truth for the code benchmark (bench/code.yaml), repository pygoat.
# Vocabulary: vocab/code.yaml. Locators are path:line relative to the repository root.
repo: pygoat
url: https://github.com/adeyosemanputra/pygoat
sha: 2aa4cc14f251e4a780e94e200aed6b36a5b15c21
labelled: 2026-11-14
scope: >
  The Django platform (pygoat/, introduction/, challenge/, scoring/) plus the 24 lab apps it builds
  and serves per user. challenge/management/commands/populate_labs.py:20-45 registers every
  directory under dockerized_labs/ and challenge/labs/. challenge/views.py:349-453 builds and
  starts them as containers, and Traefik routes lab-<user>-<lab>.<LAB_DOMAIN> to them
  (challenge/views.py:411-424, docker-compose.yml:38-50). Lab code counts as served code; every
  locator under dockerized_labs/ or challenge/labs/ is inside a lab, and each note says so with
  [lab]. Excluded: tests.py files, migrations, docs/, Solutions/, chatbot/ notebook, PyGoatBot.py
  (a local CLI, not served), and code shown as text inside templates.
standards:
  asvs: OWASP ASVS 5.0.0 (tag v5.0.0_release)
  nist: NIST SP 800-63B-4 final
  gdpr: Regulation (EU) 2016/679, Art. 17 and Art. 44 to 46

system:
  password_auth:
    value: true
    at: [pygoat/urls.py:26, pygoat/settings.py:159]
    note: "The platform login is django.contrib.auth LoginView (/login/), plus allauth (/accounts/login/) and Django admin. Most labs also have password logins."
  password_is_sole_factor:
    value: true
    at: [pygoat/settings.py:159, pygoat/urls.py:26]
    note: "No MFA app installed (no allauth.mfa or django-otp). A password alone logs in. Google OAuth is an alternative, not a second factor."
  password_min_length:
    value: 0
    at: [dockerized_labs/insecure_design_lab/app.py:69, pygoat/settings.py:120]
    note: "The platform enforces 8 (Django MinimumLengthValidator default, settings.py:120). Labs enforce nothing: insecure_design_lab /register (:66-83) accepts an empty password, broken_auth_lab /register (:81) needs only a non-empty one, and insufficient_logging_lab change_password (:61) takes anything. The value is the weakest path; the platform alone is 8."
  password_max_length:
    value: 100000
    at: [introduction/forms.py:8]
    note: "UserCreationForm password fields have no max_length and the labs set none. Only the 2.5 MB request-body limit applies."
  password_composition_rules:
    value: true
    at: [pygoat/settings.py:126]
    note: "NumericPasswordValidator rejects passwords made only of digits, i.e. it requires a non-digit character. The labs impose no rules."
  password_blocklist_check:
    value: false
    at: [pygoat/settings.py:123, dockerized_labs/broken_auth_lab/app.py:81, dockerized_labs/insecure_design_lab/app.py:76, dockerized_labs/insufficient_logging_lab/app.py:61]
    note: "The platform checks Django's CommonPasswordValidator list (20,000 entries) on registration, password change and reset, and so does the sensitive_data_exposure lab. The other lab password-setting paths check nothing. The value is false for the system; the platform alone is true."
  password_periodic_change:
    value: false
    at: [pygoat/settings.py:115]
    note: "No expiry anywhere."
  login_rate_limited:
    value: false
    at: [pygoat/urls.py:26, pygoat/urls.py:24]
    note: "Django LoginView (/login/, where home() redirects to 'login') and the admin login have no throttling. allauth's /accounts/login/ has ACCOUNT_LOGIN_ATTEMPTS_LIMIT=5 by default (library default, not configured here), but the main form bypasses it. In the labs only auth_failure_lab lab2 locks out after 5 failures (:159-163)."
  processes_personal_data:
    value: true
    at: [introduction/forms.py:9, pygoat/settings.py:167]
    note: "Usernames, email (required at registration), and Google profile and email via allauth. In the labs: emails, names and fake SSN or card data (sensitive_data_exposure lab)."
  account_erasure:
    value: true
    at: [pygoat/urls.py:24, challenge/models.py:54, scoring/models.py:74, scoring/models.py:110, scoring/models.py:155]
    note: "Django admin is enabled and deleting a User cascades to UserChallenge, LabCompletion, LabScore and UserAchievement (and allauth EmailAddress/SocialAccount). stop_user_labs removes the user's lab containers with their in-container data (challenge/views.py:456-485). There is no self-service deletion."

elements:
  # ================= PasswordStore
  - {type: PasswordStore, at: "introduction/forms.py:16", facts: {algorithm: pbkdf2, salted: true}, note: "Registration through UserCreationForm.save -> set_password. No PASSWORD_HASHERS setting, so Django 4.2's default PBKDF2-HMAC-SHA256 with 600,000 iterations and a 128-bit salt is used, which Appendix C approves. argon2-cffi is installed but not configured."}
  - {type: PasswordStore, at: "dockerized_labs/broken_auth_lab/app.py:84", facts: {algorithm: plaintext, salted: false}, note: "[lab] /register stores the plaintext password in an in-memory dict."}
  - {type: PasswordStore, at: "dockerized_labs/broken_auth_lab/app.py:53", facts: {algorithm: plaintext, salted: false}, note: "[lab] Login compares plaintext."}
  - {type: PasswordStore, at: "dockerized_labs/auth_failure_lab/app.py:82", facts: {algorithm: argon2, salted: true}, note: "[lab] lab2 admin hashed with argon2-cffi PasswordHasher defaults (argon2id, t=3, m=64 MiB, p=4, 16-byte salt) and verified at :150. Approved."}
  - {type: PasswordStore, at: "dockerized_labs/auth_failure_lab/app.py:213", facts: {algorithm: sha256, salted: false}, note: "[lab] lab3 hashes with unsalted SHA-256 and compares with the stored hashes at :53-71."}
  - {type: PasswordStore, at: "dockerized_labs/crypto_failure_lab/app.py:38", facts: {algorithm: md5, salted: false}, note: "[lab] lab1 uses unsalted MD5 against the hashes at :11-13."}
  - {type: PasswordStore, at: "dockerized_labs/crypto_failure_lab/app.py:25", facts: {algorithm: sha1, salted: false}, note: "[lab] lab2 custom_hash is unsalted SHA-1, used at :51 against :18-20."}
  - {type: PasswordStore, at: "dockerized_labs/crypto_failure_lab/app.py:88", facts: {algorithm: plaintext, salted: false}, note: "[lab] lab3 compares with a hard-coded plaintext password."}
  - {type: PasswordStore, at: "dockerized_labs/sql_injection_lab/app.py:51", facts: {algorithm: plaintext, salted: false}, note: "[lab] The submitted password is compared verbatim in SQL with the stored string seeded at :27. No hashing is applied to input; the stored value is just a hex string used as the password."}
  - {type: PasswordStore, at: "dockerized_labs/insecure_design_lab/app.py:76", facts: {algorithm: plaintext, salted: false}, note: "[lab] Registration stores the plaintext password (SQLite); login compares at :56."}
  - {type: PasswordStore, at: "dockerized_labs/insufficient_logging_lab/app.py:61", facts: {algorithm: plaintext, salted: false}, note: "[lab] change_password stores the plaintext password; login compares at :40."}
  - {type: PasswordStore, at: "dockerized_labs/broken_access_lab/main.py:46", facts: {algorithm: plaintext, salted: false}, note: "[lab] Plaintext compare against the users at :18-19."}
  - {type: PasswordStore, at: "challenge/labs/bopla_lab/app.py:73", facts: {algorithm: plaintext, salted: false}, note: "[lab] Plaintext compare against the users at :48-50."}
  - {type: PasswordStore, at: "challenge/labs/security_headers_lab/app.py:78", facts: {algorithm: plaintext, salted: false}, note: "[lab] Plaintext compare against the USERS at :20, :27."}
  - {type: PasswordStore, at: "dockerized_labs/sensitive_data_exposure/dataexposure/views.py:59", facts: {algorithm: pbkdf2, salted: true}, note: "[lab] Django 3.2.18 create_user uses PBKDF2-HMAC-SHA256 with 260,000 iterations, below the 600,000 Appendix C requires, so it is not approved. The same holds for the demo user at entrypoint.sh:11."}

  # ================= Query (reachable by request data)
