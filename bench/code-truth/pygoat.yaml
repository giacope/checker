    failing: []
    deciding: "Visitors' IP addresses go to US-based CDNs and Google Fonts on every page, and to Google for OAuth sign-in. A legal basis depends on facts outside the repository: whether each recipient (Google LLC, Cloudflare, Fonticons, StackPath/jsDelivr operators) is certified under the EU-US Data Privacy Framework, or whether SCCs or DPAs are in place, and whether the operator collects consent. The repository shows none of this."

confidence_notes:
  - "Scope: the verdicts treat the 24 lab apps as part of the system because the platform builds, starts and routes them per user. Restricted to the Django platform, the verdicts would be C1 pass, C2 pass, C3 fail, C4 not_applicable, C5 fail, C6 pass, C7 fail, C8 fail, C9 pass, C10 fail, C11 pass, C12 uncertain."
  - "C8 is the least certain: whether Django's NumericPasswordValidator is a composition rule. I read 'SHALL NOT impose other composition rules' strictly. A labeller who sees it as a narrow blocklist of digit-only strings would say pass (the labs impose no rules)."
  - "System attributes that differ between platform and labs: I report the weakest path (min length 0, blocklist false, composition true) and give the platform value in the note."
  - "C11 pass rests on Django admin as the erasure path. Residue remains: django_admin_log keeps the deleted user's repr, and lab containers that are only stopped (not removed) keep data. There is no self-service deletion."
  - "C10: allauth's /accounts/login/ is throttled by its library default (5 attempts per 5 min), but the primary /login/ (Django LoginView) and the admin login are not, so the verdict is fail."
  - "C4: I classed the base64/pickle client-held identity cookies as self-contained tokens under 9.1.1. allauth's Google provider decodes the id_token with verify_signature False (library code, allauth/socialaccount/providers/google/views.py at 0.52.0). OIDC allows that because the token comes straight from Google's token endpoint over TLS, so it is not labelled."
  - "C5 test_or_example: Flask/Django signing keys and seeded lab passwords count as live (false). Decoy credentials for systems that do not exist (sde, sec_misconfig 404 dump, dependency/package SENSITIVE_DATA) count as true."
  - "C6: Werkzeug and gunicorn access logs (request lines with query strings, e.g. software_integrity_lab /lab2?username=) are framework behaviour and are not labelled."
  - "C12: counting browser-loaded CDN and font resources as transfers is a judgment (LG München I, 3 O 17493/20)."
