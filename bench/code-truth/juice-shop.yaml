  - {type: Query, at: "routes/search.ts:23", facts: {construction: interpolated, untrusted_input: true}, note: "Raw SQL LIKE with req.query.q (UNION injection challenge); only truncated to 200 chars."}
  - {type: Query, at: "routes/showProductReviews.ts:36", facts: {construction: concatenated, untrusted_input: true}, note: "MarsDB $where 'this.product == ' + req.params.id; string kept (trunc 40) unless noSqlCommandChallenge is disabled (Docker/Heroku), then Number()."}
  - {type: Query, at: "routes/trackOrder.ts:18", facts: {construction: interpolated, untrusted_input: true}, note: "MarsDB $where with req.params.id in a JS string; sanitized only when reflectedXssChallenge is disabled (Docker/Heroku)."}
  - {type: Query, at: "routes/updateProductReviews.ts:18", facts: {construction: operator_object, untrusted_input: true}, note: "update({_id: req.body.id}, ..., {multi: true}); id may be an operator object such as {$ne: -1}."}
