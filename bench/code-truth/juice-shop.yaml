verdicts:
  C1:
    verdict: fail
    requirement: "ASVS 5.0 11.4.2"
    quote: "Verify that passwords are stored using an approved, computationally intensive, key derivation function (also known as a \"password hashing function\")"
    also: "11.4.1: \"Disallowed hash functions, such as MD5, must not be used for any cryptographic purpose.\""
    failing: [lib/insecurity.ts:41, models/user.ts:73, routes/login.ts:34, routes/changePassword.ts:39, routes/2fa.ts:107, routes/2fa.ts:152]
    reason: "Unsalted single-round MD5."
  C2:
    verdict: fail
    requirement: "ASVS 5.0 1.2.4"
    quote: "Verify that data selection or database queries (e.g., SQL, HQL, NoSQL, Cypher) use parameterized queries, ORMs, entity frameworks, or are otherwise protected from SQL Injection and other database injection attacks."
    failing: [routes/login.ts:34, routes/search.ts:23, routes/showProductReviews.ts:36, routes/trackOrder.ts:18, routes/updateProductReviews.ts:18, routes/likeProductReviews.ts:25, routes/likeProductReviews.ts:35, routes/likeProductReviews.ts:43, routes/likeProductReviews.ts:50]
    reason: "Two raw SQL strings and two MarsDB $where strings built from request data; NoSQL filters take operator objects straight from req.body. The remaining Sequelize/MarsDB calls bind values safely; chat.ts:150 is concatenated but neutralised by Number()."
  C3:
    verdict: fail
    requirement: "ASVS 5.0 3.3.1, 3.3.4 (also 3.3.2)"
    quote: "3.3.1: \"Verify that cookies have the 'Secure' attribute set\"; 3.3.4: \"if the value of a cookie is not meant to be accessible to client-side scripts (such as a session token), the cookie must have the 'HttpOnly' attribute set\"; 3.3.2: \"each cookie's 'SameSite' attribute value is set according to the purpose of the cookie\""
    failing: [lib/insecurity.ts:192, routes/updateUserProfile.ts:42]
    reason: "The session JWT cookie is set with no Secure, HttpOnly, SameSite or __Host-/__Secure- prefix."
  C4:
    verdict: fail
    requirement: "ASVS 5.0 9.1.1, 9.1.2"
    quote: "9.1.1: \"Verify that self-contained tokens are validated using their digital signature or MAC to protect against tampering before accepting the token's contents.\" 9.1.2: \"only algorithms on an allowlist can be used ... and must not include the 'None' algorithm. ... additional controls will be needed to prevent key confusion.\""
    failing: [lib/insecurity.ts:52, lib/insecurity.ts:55, lib/insecurity.ts:156, lib/insecurity.ts:189, routes/2fa.ts:20, routes/2fa.ts:115, routes/currentUser.ts:17, routes/verify.ts:125, routes/chat.ts:45, routes/chat.ts:224]
