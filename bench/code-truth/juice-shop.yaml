# Ground truth for the code benchmark: OWASP Juice Shop.
# Labels rest on application code and its runtime configuration (server.ts, lib/, routes/,
# models/, data/ runtime loaders and data/static/*.yml, config/, views/, encryptionkeys/,
# ctf.key, terraform/ and infrastructure/ which the app serves at /infrastructure).
# Out of scope: test/, frontend/, node_modules/, docs, rsn/ (dev tooling),
# data/static/codefixes/ (code snippets shown to players, never executed).
# Secret values are deliberately not reproduced here; locators point to them.
repo: juice-shop
url: https://github.com/juice-shop/juice-shop
sha: 266448aba68cd8ba5915f526a128da4fa7bc3f9f
labelled: 2026-11-14
standards:
  asvs: "OWASP ASVS 5.0.0 (tag v5.0.0_release, github.com/OWASP/ASVS 5cf9b03, 2025-05-30)"
  nist: "NIST SP 800-63B-4 final (pages.nist.gov/800-63-4/sp800-63b)"
  gdpr: "Regulation (EU) 2016/679 (EUR-Lex CELEX:32016R0679)"

system:
  password_auth:
    value: true
    at: [routes/login.ts:34, server.ts:635]
    note: "POST /rest/user/login compares email + md5(password) in SQL."
  password_is_sole_factor:
    value: true
    at: [routes/login.ts:37, models/user.ts:109]
    note: "TOTP is only demanded when the user opted in (totpSecret defaults to ''); passkeys are an alternative, not a second factor."
  password_min_length:
    value: 0
    at: [server.ts:440, server.ts:442, routes/verify.ts:23, routes/changePassword.ts:19, routes/resetPassword.ts:26]
    note: "Server only rejects empty passwords, and on registration only when email, password and passwordRepeat are all present (the emptyUserRegistration challenge registers an empty password). The 5-character minimum exists only in the excluded Angular frontend."
  password_max_length:
    value: 100000
    at: [server.ts:440, models/user.ts:70]
    note: "No server-side maximum; only Express body/URL size limits apply. Frontend max 40 is out of scope."
  password_composition_rules:
    value: false
    at: [server.ts:440, routes/changePassword.ts:19, routes/resetPassword.ts:26]
    note: "No character-class checks anywhere server-side."
  password_blocklist_check:
    value: false
    at: [server.ts:440, routes/changePassword.ts:51, routes/resetPassword.ts:44]
    note: "Registration, change and reset store any non-empty password; no list lookup exists."
  password_periodic_change:
    value: false
    at: [models/user.ts:20]
    note: "No password age field or expiry logic."
  login_rate_limited:
    value: false
    at: [server.ts:635, server.ts:375, server.ts:491]
    note: "No limiter on /rest/user/login or /rest/passkey/login-verify. Limiters exist only for reset-password (per IP via X-Forwarded-For under trust proxy, spoofable) and the 2FA endpoints (100 per 5 min per IP), never per account."
  processes_personal_data:
    value: true
    at: [models/user.ts:44, models/user.ts:56, models/user.ts:101, models/address.ts:41, models/card.ts:37, routes/order.ts:164]
    note: "Usernames, emails, last login IP, postal addresses, payment cards, orders."
  account_erasure:
    value: false
    at: [routes/dataErasure.ts:83, routes/dataErasure.ts:88, server.ts:399]
    note: "The erasure form only inserts a PrivacyRequest row (deletionRequested=true) and clears the cookie; no code reads PrivacyRequests or deletes the user. DELETE /api/Users/:id is denyAll."

