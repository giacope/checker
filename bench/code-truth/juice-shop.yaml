  - {type: PasswordStore, at: "models/user.ts:73", facts: {algorithm: md5, salted: false}, note: "User.password setter stores security.hash(clearTextPassword); covers registration (finale), change, reset and seeding."}
  - {type: PasswordStore, at: "routes/login.ts:34", facts: {algorithm: md5, salted: false}, note: "Login compares password = md5(req.body.password) inside the SQL string."}
  - {type: PasswordStore, at: "routes/changePassword.ts:39", facts: {algorithm: md5, salted: false}, note: "Current password checked as md5 against the stored hash."}
  - {type: PasswordStore, at: "routes/2fa.ts:107", facts: {algorithm: md5, salted: false}, note: "2FA setup re-confirms password via md5 compare."}
  - {type: PasswordStore, at: "routes/2fa.ts:152", facts: {algorithm: md5, salted: false}, note: "2FA disable re-confirms password via md5 compare."}

  # ---------------- Query (reachable by untrusted input) ----------------
