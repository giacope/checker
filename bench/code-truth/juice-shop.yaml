confidence_notes:
  - "C4 rests on how the pinned legacy libraries behave (express-jwt 0.1.3, jsonwebtoken 0.4.0, the jws they pull in); node_modules is not in the checkout and no lockfile is committed. The app's own detectors (routes/verify.ts:86-133) solve the 'unsigned JWT' and 'forged HS256 JWT' challenges only when jwt.verify(token, publicKey) succeeds for those headers, which confirms the behaviour by design. Older jsonwebtoken CVE-2015-9235 fits too."
  - "Raw-SQL/$where element construction: template literals are labelled interpolated, '+' concatenation is labelled concatenated. showProductReviews.ts:36 and trackOrder.ts:18 are injectable in the default config (safetyMode auto, not Docker/Heroku). In Docker/Heroku the input is coerced or sanitised (showProductReviews.ts:31, trackOrder.ts:15). Labelled failing on the code as written."
  - "chat.ts:150 is concatenated with untrusted input but protected by Number(); labelled concatenated and kept out of C2's failing list. A purely structural rule would flag it."
  - "Equality filters with string-only values (orderHistory.ts:36 path param, chat.ts:167 zod string) are labelled orm rather than operator_object, because a string cannot carry operators."
  - "Sequelize where-clauses that take req.body values (resetPassword.ts:35, wallet.ts:24, captcha.ts:37 ...) are labelled orm. Sequelize v6 only honours Symbol operators, so JSON cannot inject them (arrays become IN)."
  - "password_min_length = 0: registration skips the empty check when passwordRepeat is absent, and the app ships an 'emptyUserRegistration' challenge. If a reader counts the non-empty checks on change/reset, the value would be 1; C7 fails either way. Registration also trims passwords (server.ts:444) and login does not, an ASVS 6.2.8 issue outside these checks."
  - "Most of the real session cookie handling is in the frontend (out of scope), which also sets 'token' client-side. Server-set cookies alone are enough to fail C3."
  - "C6: data/datacreator.ts:708 logs only seed-fixture security answers, and only on insert failure; it is a minor locator. The errorhandler credential leak (SQL error echoing the md5 of the password) depends on the SQLite error text; the IP/email part is certain. lib/webhook.ts:40 logs the SOLUTIONS_WEBHOOK URL, which could carry a token if an operator uses a tokenised webhook URL; not labelled."
  - "Security answers are stored with HMAC-SHA256 under a hard-coded key (models/securityAnswer.ts:45). This is a knowledge-based recovery secret, not a password, so it is not a PasswordStore element. It counts under C5 for the key."
  - "C11 could be argued 'uncertain' if an operator erased data by hand outside the code. Labelled fail because nothing in the system ever reads PrivacyRequests, there is no admin path, and the UI implies processing that never happens. Note also that sequelize.sync({force:true}) (server.ts:776) wipes the whole DB on every restart; this is not erasure on request."
  - "C12: no other server-side transfer of personal data exists. lib/webhook.ts:18 sends challenge/host metadata only; Alchemy websockets (routes/nftMint.ts:18, routes/web3Wallet.ts:20) only listen for chain events; profileImageUrlUpload.ts:24 fetches a user-chosen URL (SSRF) and sends no user data. Google OAuth runs client-side in the excluded frontend. The Google clientId in config/default.yml:65 is a public identifier, not a Secret."
  - "Seeded-account passwords (users.yml, login.ts:59) are labelled real secrets (test_or_example false) because every deployment creates those accounts, admin included. A grader treating demo data as fixtures would flip them; C5 still fails on lib/insecurity.ts:21."
