regulation: {id: rfe5181cd6e, name: OWASP Secure Coding Practices v2.0}
method: >-
  Each enabled computed or assessed check was judged against its clause text by reading the
  microblog source at the pinned commit (app package, Jinja templates, config.py, tests.py,
  migrations, Dockerfile, boot.sh, Procfile, .flaskenv, requirements.txt and deployment/ nginx and
  supervisor configs) without running it. Documented Flask, Werkzeug, Flask-Login, Flask-WTF,
  WTForms, Flask-HTTPAuth, Flask-SQLAlchemy/SQLAlchemy, PyJWT and Jinja2 defaults were relied on
  where the code relies on them, and this is stated in why. The shipped default configuration
  (config.py fallbacks, gunicorn entrypoints, the nginx sample) is treated as the behaviour under
  test. Clauses that depend on infrastructure, database servers or operations not configured in
  the repository are undecidable; clauses about features the app lacks (file upload, C memory
  management, automatic updates, admin roles) are not_applicable.
