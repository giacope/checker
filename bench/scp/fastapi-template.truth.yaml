regulation: {id: rfe5181cd6e, name: OWASP Secure Coding Practices v2.0}
method: >-
  Each enabled computed or assessed check was judged against its clause text by reading the
  template source at the pinned commit (backend, frontend, Dockerfile, compose files and
  deployment docs) without running it; documented FastAPI, Starlette, Pydantic/SQLModel,
  pwdlib, PyJWT and React defaults were relied on where the code relies on them and this is
  stated in why. Deployment- or process-dependent clauses are undecidable and clauses about
  features the template lacks (file upload, cookies, C memory management) are not_applicable.
