artifact: {repo: OWASP/railsgoat, commit: f5951f13089d85c979de09e7da3c8c0fb982f94a}
regulation: {id: rfe5181cd6e, name: OWASP Secure Coding Practices v2.0}
method: >-
  Each computed or assessed check was judged against its clause text by reading the RailsGoat source at the pinned commit (controllers, models, lib, views, config, db, Gemfile, Dockerfile, Procfile) and cross-checking the RailsGoat wiki's descriptions of its intentional vulnerabilities, without looking at any system output.
  fail and pass were given only where a cited line showed the behaviour; checks that depend on deployment, infrastructure, process or framework defaults not in the repository were labelled undecidable, and checks about features RailsGoat lacks (native memory handling, security questions, auto-update) were labelled not_applicable.
labels:
  # --- General / input validation ---
  k16-1: {truth: undecidable, confidence: medium, at: [lib/encryption.rb:1-37], why: "The only home-grown reusable security library is the insecure encryption module; whether the app provides a reusable object library in the ESAPI sense is a design judgement the code cannot settle."}
