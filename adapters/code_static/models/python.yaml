# Built-in framework model for Python: library calls whose meaning is fixed by the library.
# Format: adapters/code_static/models.py. Knowledge that has to read the call's arguments or the project's
# settings (hashlib.new, passlib CryptContext schemes, Django PASSWORD_HASHERS, PyJWT options, cookie defaults per
# framework) stays in pyast.py.
model: builtin-python
language: python
rules:
  # ---- password hashing (hashlib.md5(pw).hexdigest() is the same call, so `.**`)
  - call: hashlib.md5.**
    password_hash: {algorithm: md5, salted: infer, password: 0}
  - call: hashlib.sha1.**
    password_hash: {algorithm: sha1, salted: infer, password: 0}
  - call: [hashlib.sha224.**, hashlib.sha256.**, hashlib.sha3_256.**]
    password_hash: {algorithm: sha256, salted: infer, password: 0}
  - call: [hashlib.sha384.**, hashlib.sha512.**, hashlib.sha3_512.**]
    password_hash: {algorithm: sha512, salted: infer, password: 0}
  - call: [hashlib.blake2b.**, hashlib.blake2s.**]
    password_hash: {algorithm: other, salted: infer, password: 0}
  - call: [bcrypt.**.hashpw, bcrypt.**.checkpw, bcrypt.**.hash, bcrypt.**.verify, bcrypt.**.using]
    password_hash: {algorithm: bcrypt, salted: true, password: 0}
  - call: [base64.b64encode, base64.encodebytes, base64.urlsafe_b64encode, codecs.encode]
    password_hash: {algorithm: reversible, salted: false, password: 0}

  # ---- transfers to third parties
  - call: [django.core.mail.send_mail, django.core.mail.send_mass_mail]
    transfer: {recipient: email (SMTP relay), personal_data: true}
  - call: [stripe.**.create, stripe.**.send]
    transfer: {recipient: Stripe, personal_data: infer}
  - call: [openai.**.create, openai.**.send]
    transfer: {recipient: OpenAI, personal_data: infer}
  - call: [anthropic.**.create, anthropic.**.send]
    transfer: {recipient: Anthropic, personal_data: infer}
  - call: [twilio.**.create, twilio.**.send]
    transfer: {recipient: Twilio, personal_data: infer}
