# Example building projects: real, openly licensed drawing sets and models, fetched from their
# publishers and processed by the same pipeline as an upload (`uv run python -m app.seed`).
#
# A file is { url, sha256 } of what the publisher serves, with `member` when it is one file
# inside a zip. `local` is a path under NORMIR_SEED_INPUTS where a copy may already be
# (checked against sha256 before use); otherwise the url is downloaded once into
# ~/.cache/normir/seeds/<sha256>.

clinic:
  name: NIBS Medical/Dental Clinic — model, life safety, stair and door sheets
  codes: [ibc, ada]
  source: https://github.com/buildingsmart-community/Community-Sample-Test-Files/tree/main/IFC%202.3.0.1%20(IFC%202x3)/Medical-Dental%20Clinic
  licence: >-
    CC BY 4.0 — BSI (2020) "Medical-Dental Test Files," buildingSMART International, republishing the NIBS
    Common BIM Files (WBDG). Files unchanged; 12 of the 316 drawing sheets are used.
  files:
    - &clinic_dwg
      url: https://www.wbdg.org/FFC/BIM/LCie/Clinic%20Model/2012-03-27-ClinicDrawingsRedacted.zip
      sha256: 2cc97cb40080f2875c935101205f71e06a666d9c0d2cfa54febd13e0e376cb77
