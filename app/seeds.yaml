      member: 2012-03-27-ClinicRedactedDrawings/Clinic_161_Life Safety Composite First Floor Plan.pdf
    - {<<: *clinic_dwg, member: 2012-03-27-ClinicRedactedDrawings/Clinic_162_Life Safety Composite Second Floor Plan.pdf}
    - {<<: *clinic_dwg, member: "2012-03-27-ClinicRedactedDrawings/Clinic_122_Enlarged Stair #1 Floor Plans & Section.pdf"}
    - {<<: *clinic_dwg, member: "2012-03-27-ClinicRedactedDrawings/Clinic_123_Enlarged Stair #2 Floor Plans & Section.pdf"}
    - {<<: *clinic_dwg, member: "2012-03-27-ClinicRedactedDrawings/Clinic_124_Enlarged Stair #3 Floor Plans & Section & Details.pdf"}
    - {<<: *clinic_dwg, member: "2012-03-27-ClinicRedactedDrawings/Clinic_126_Exterior Stair & Ramp Sections & Details.pdf"}
    - {<<: *clinic_dwg, member: 2012-03-27-ClinicRedactedDrawings/Clinic_079_Door Schedule.pdf}
    - {<<: *clinic_dwg, member: 2012-03-27-ClinicRedactedDrawings/Clinic_080_Door Schedule.pdf}
    - {<<: *clinic_dwg, member: 2012-03-27-ClinicRedactedDrawings/Clinic_081_Door Schedule.pdf}
